          "description": "Slots left in the current epoch, one slot per second. The epoch length comes from each node's network label: 86400 slots on preview, 432000 on preprod and mainnet.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
