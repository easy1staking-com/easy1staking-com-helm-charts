              "legendFormat": "{{ "{{" }}node{{ "}}" }}",
              "refId": "A"
            }
          ],
          "title": "Epoch",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
