apiVersion: v2
name: ft-aquarium-node
description: A Helm chart for the FluidTokens Aquarium node (preview)

type: application

# Chart version — this chart's own semver. Bump on every chart change.
# NOTE: bumping this in a commit to `main` publishes the chart immediately via
# chart-releaser. That bump is the release gate and belongs to Giovanni.
version: 0.10.1

# Upstream image tag. This is FluidTokens' published build, NOT one we produce.
# See README.md — this tag does not contain the Lending v4 liquidation work.
# ⛔ appVersion TRACKS THE REGISTRY, AND THE CHART FALLS BACK TO IT WHEN NO
# image.tag IS SET — so this value IS the default image.
#
# 2026.09.17, verified on Docker Hub today:
#   fluidtokens/ft-aquarium-node:2026.09.17
#   sha256:da105d5649655a0a207388cf40349ca99afab154ae9332bd0409d3575d1a1d84
# Built from main at 61b3e6d. Was 2026.07.13 — two months and six releases stale.
#
# ⚠⚠ BUMPING THIS PAST 2026.09.17 ALSO SWITCHES OPERATORS TO A NON-ROOT IMAGE.
# THAT IS NO LONGER A FORWARD-DATED WARNING — IT HAS HAPPENED.
#
#   2026.09.17 and earlier   runs as ROOT (verified: no `User` field in the config blob)
#   2026.09.19 and later     runs as uid 10001
#
# ⇒ A TAG COMPARISON AND NOT A DATE, DELIBERATELY. There is no 2026.09.18 image —
# the Dockerfile change was WRITTEN on the 18th and SHIPPED in 2026.09.19, and a
# note dated by the writing would send an operator looking for a build that does
# not exist. Published sequence: 2026.09.14, 2026.09.17, 2026.09.19, 2026.09.20.
# Ask "is the tag I run at or past 2026.09.19", which is checkable; do not ask
# "is it after some date", which is not.
#
# ⇒ CONSEQUENCE: at 2026.09.19+, `secret.mode: file` WITHOUT a matching
# podSecurityContext fails with AccessDeniedException, and nothing in this chart
# can detect that from a tag. The default `secret.mode: env` is immune — it mounts
# nothing. See values.yaml.
#
# ⚠ This note previously said the change "lives on an unmerged draft (PR #36) and
# reaches the registry only when that merges". True when written, false now. Left
# visible rather than overwritten: a forward-dated warning becomes a stale claim
# the moment the thing it predicts happens, and that is the same defect it was
# written to prevent.
appVersion: "2026.09.17"
