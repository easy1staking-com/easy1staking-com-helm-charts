{{- /*
  ── Secret resolution ────────────────────────────────────────────────────────
  ONE mechanism: a name and a key per source. There is no chart-wide
  `secret.name` and no chart-wide `secret.keys` — this form expresses everything
  they could (point all three at the same Secret) and things they could not (the
  wallet in one Secret, the DB password in the operator's).

  ⛔ THE SEED STAYS A FILE. In `file` mode the pod mounts a PROJECTED volume with
  one source per Secret, so three independent names land in one directory and the
  wallet mnemonic is a 0400 file. Implementing this as three secretKeyRef env
  vars would put the seed in the pod spec and reverse the chart's central
  security decision as a side effect of a refactor that looked like tidying.
*/ -}}
{{- $sec := .Values.secret | default dict -}}
{{- $mn := $sec.mnemonic | default dict -}}
{{- $bf := $sec.blockfrost | default dict -}}
{{- $db := $sec.db | default dict -}}
{{- /*
  ⛔ REMOVED PATHS FAIL LOUDLY RATHER THAN BEING IGNORED.

  `secret.name`, `secret.keys` and `secret.dbPasswordFrom` were removed in 0.3.0.
  A values file still carrying them would otherwise render a pod with NO secrets
  at all — silently, because an unknown key in Helm values is not an error. That
  is the "value that looks inert and is authoritative" failure this chart has
  been bitten by before, inverted: a value that looks authoritative and is inert.
*/ -}}
{{- if or $sec.name $sec.keys $sec.dbPasswordFrom -}}
{{- fail "secret.name / secret.keys / secret.dbPasswordFrom were removed in ft-aquarium-node 0.3.0. Set a name and key per source instead: secret.mnemonic.name, secret.blockfrost.name, secret.db.name (each with an optional .key; the defaults are the same key names as before). To reproduce the old single-Secret behaviour, point all three at the same name. See README, \"Migrating from 0.2.0\"." -}}
{{- end -}}
{{- $mnName := $mn.name -}}
{{- $bfName := $bf.name -}}
{{- /*
  The DB Secret defaults to the one the Zalando operator generates for the role
  this chart's CR asks for. DERIVED from postgres.username + postgres.clusterName
  rather than restated, so renaming the cluster cannot leave a stale reference.
*/ -}}
{{- $dbName := $db.name | default (ternary (include "ft-aquarium-node.zalandoSecretName" .) "" .Values.postgres.enabled) -}}
{{- $mnKey := $mn.key | default "wallet-mnemonic" -}}
{{- $bfKey := $bf.key | default "blockfrost-key" -}}
{{- $dbKey := $db.passwordKey | default "db-password" -}}
{{- /*
  The DB USERNAME may also come from the Secret — the Zalando operator's per-role
  Secret carries both credentials, under `username` and `password`. Empty means
  the username stays the plain `config.db.username` value.
*/ -}}
{{- $dbUserKey := $db.usernameKey -}}
{{- $dbUserFromSecret := and $dbName $dbUserKey -}}
{{- /*
  The DB password may use a different projection from the other two: it is the
  one secret that is operator-owned and rotatable. Defaults to `secret.mode`.
*/ -}}
{{- $dbMode := $db.mode | default $sec.mode -}}
{{- /*
  ⛔ NO HALF-CONFIGURED SECRET SET.

  The failure this prevents is NOT fast: `wallet.mnemonic` and `blockfrost.key`
  both default to "" in the application, so a pod missing one starts, runs, and
  fails later against an API it cannot authenticate to — an outage shape rather
  than a config gap.

  Scoped to the two the OPERATOR supplies. The DB source resolves on its own when
  `postgres.enabled`, so naming nothing at all stays legal and renders: the
  database is wired, the wallet secrets are absent, and the application fails at
  startup with a named error about the mnemonic. That is the documented
  install-to-look-at-it state and it must keep working.
*/ -}}
{{- if and (or $mnName $bfName) (not (and $mnName $bfName)) -}}
{{- fail (printf "secret: %s named but %s not. The mnemonic and the Blockfrost key must both be named (point them at the same Secret if that is what you want) or both be left unset — a pod with one and not the other starts and fails later against an API it cannot reach." (ternary "mnemonic" "blockfrost" (not (empty $mnName))) (ternary "blockfrost" "mnemonic" (not (empty $mnName)))) -}}
{{- end -}}
{{- /*
  And the DB half: if the wallet secrets are configured but nothing supplies a
  database credential, that is the same half-configured shape one table over.
*/ -}}
{{- if and $mnName $bfName (not $dbName) -}}
{{- fail "secret: mnemonic and blockfrost are named but the database has no credential source. Either enable postgres.enabled (the operator generates the Secret) or set secret.db.name to a Secret you manage." -}}
{{- end -}}
{{- $mnFile := and $mnName (eq $sec.mode "file") -}}
{{- $bfFile := and $bfName (eq $sec.mode "file") -}}
{{- $dbFile := and $dbName (eq $dbMode "file") -}}
{{- $anyFile := or $mnFile $bfFile $dbFile -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ft-aquarium-node.fullname" . }}
  labels:
    {{- include "ft-aquarium-node.labels" . | nindent 4 }}
spec:
  {{- /*
    SINGLETON, and deliberately not a value.

    The node signs and submits from ONE wallet. Two pods running at once race
    the same UTxO set, which is how the same liquidation gets submitted twice.
    Recreate rather than RollingUpdate for the same reason: a rolling update
    overlaps the old and new pods, which is exactly the state being avoided.

    This bounds concurrency; it does not make double-submission impossible.
    Only the application can do that, by keying submission on something on
    chain. No Kubernetes primitive closes that gap.
  */}}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ft-aquarium-node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ft-aquarium-node.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.waitForPostgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.waitForPostgres.image.repository }}:{{ .Values.waitForPostgres.image.tag }}"
          imagePullPolicy: {{ .Values.waitForPostgres.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "ft-aquarium-node.dbHost" . }} {{ .Values.config.db.port }}; do
                echo "waiting for postgres at {{ include "ft-aquarium-node.dbHost" . }}:{{ .Values.config.db.port }}"
                sleep 5
              done
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ include "ft-aquarium-node.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.config.springProfile | quote }}
            {{- if $anyFile }}
            {{- /*
              Spring Boot config tree: every file under this directory becomes a
              property named for the file, with the file's contents as its
              value. "optional:" so that a missing mount still lets the process
              start far enough to fail with a NAMED error rather than a path error.
            */}}
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configtree:{{ .Values.secret.mountPath }}/"
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.jvm.opts | quote }}
            - name: DB_DRIVER
              value: {{ .Values.config.db.driver | quote }}
            - name: DB_DIALECT
              value: {{ .Values.config.db.dialect | quote }}
            - name: POSTGRES_HOST
              value: {{ include "ft-aquarium-node.dbHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.config.db.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.db.database | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.config.db.schema | quote }}
            {{- /*
              Emitted ONLY when the username is not secret-sourced. Emitting both
              would put two DB_USERNAME entries in the container spec, and
              Kubernetes silently keeps the last — so the plain value could beat
              the Secret with nothing to show for it.
            */}}
            {{- if not $dbUserFromSecret }}
            - name: DB_USERNAME
              value: {{ .Values.config.db.username | quote }}
            {{- end }}
            - name: DB_URL
              value: {{ include "ft-aquarium-node.dbUrl" . | quote }}
            - name: STORE_CARDANO_HOST
              value: {{ .Values.config.store.cardano.host | quote }}
            - name: STORE_CARDANO_PORT
              value: {{ .Values.config.store.cardano.port | quote }}
            {{- /*
              Cursor cleanup, undocumented upstream. `kindIs "invalid"` rather
              than `with`, so an explicit 0 reaches the application instead of
              being silently dropped as falsy — see the warnings in values.yaml
              about what 0 does to noOfBlocksToKeep. null omits the variable and
              inherits yaci-store's own default.
            */}}
            {{- if not (kindIs "invalid" .Values.config.store.cardano.cursorCleanupIntervalSeconds) }}
            - name: STORE_CARDANO_CURSOR_CLEANUP_INTERVAL
              value: {{ .Values.config.store.cardano.cursorCleanupIntervalSeconds | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.config.store.cardano.cursorNoOfBlocksToKeep) }}
            - name: STORE_CARDANO_CURSOR_NO_OF_BLOCKS_TO_KEEP
              value: {{ .Values.config.store.cardano.cursorNoOfBlocksToKeep | quote }}
            {{- end }}
            {{- /*
              env mode: secretKeyRef variables. Still by reference — there is no
              plaintext fallback in any mode — but visible in `kubectl describe
              pod` and in Argo's UI, which is why `file` is the default and why
              the SEED in particular stays a file.
            */}}
            {{- if and $mnName (eq $sec.mode "env") }}
            - name: WALLET_MNEMONIC
              valueFrom:
                secretKeyRef:
                  name: {{ $mnName }}
                  key: {{ $mnKey }}
            {{- end }}
            {{- if and $bfName (eq $sec.mode "env") }}
            - name: BLOCKFROST_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $bfName }}
                  key: {{ $bfKey }}
            {{- end }}
            {{- if and $dbName (eq $dbMode "env") }}
            {{- /*
              ONE variable, not two. Verified against the shipped
              application.yaml: `spring.datasource.password` and
              `spring.flyway.password` are BOTH `${DB_PASSWORD:password}`, so env
              mode needs one variable. The "project it twice" rule in the volume
              below is about FILE mode, where each property needs its own file,
              and it stays true there — miss the Flyway one and the application
              connects while the migration fails.
            */}}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbName }}
                  key: {{ $dbKey }}
            {{- end }}
            {{- if and $dbUserFromSecret (eq $dbMode "env") }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbName }}
                  key: {{ $dbUserKey }}
            {{- end }}
            {{- /*
              ── The application's full parameter surface ──────────────────────
              Emitted only where a values key is set; unset means the chart says
              nothing and the image's own per-profile default governs.

              `mode` is validated because a typo silently means "not armed", and
              an operator who believes they armed the bot and did not is a worse
              failure than a refused render.
            */}}
            {{- $mode := toString .Values.liquidation.mode }}
            {{- if not (empty $mode) }}
            {{- if not (has $mode (list "disabled" "shadow" "live")) }}
            {{- fail (printf "liquidation.mode must be one of disabled|shadow|live, got %q" $mode) }}
            {{- end }}
            {{- end }}
            {{- $armed := toString .Values.liquidation.enabled }}
            {{- if not (empty $armed) }}
            {{- if not (has $armed (list "true" "false")) }}
            {{- fail (printf "liquidation.enabled must be true or false, got %q" $armed) }}
            {{- end }}
            {{- end }}
            {{- /*
              compound.enabled is validated exactly as liquidation.enabled is, and
              for the same reason: a typo silently means "not armed", and an
              operator who believes they armed compounding and did not is a worse
              failure than a refused render. These are TWO switches — arming one
              does not arm the other.
            */}}
            {{- $compoundArmed := toString (.Values.compound | default dict).enabled }}
            {{- if not (empty $compoundArmed) }}
            {{- if not (has $compoundArmed (list "true" "false")) }}
            {{- fail (printf "compound.enabled must be true or false, got %q" $compoundArmed) }}
            {{- end }}
            {{- end }}
            {{- $C := .Values.compound | default dict }}
            {{- $L := .Values.liquidation }}
            {{- $R := $L.referenceScripts | default dict }}
            {{- $N := .Values.loans | default dict }}
            {{- $NC := $N.config | default dict }}
            {{- $A := .Values.aquarium | default dict }}
            {{- include "ft-aquarium-node.env" (dict "name" "NETWORK" "value" .Values.config.network) }}
            {{- include "ft-aquarium-node.env" (dict "name" "BLOCKFROST_URL" "value" (.Values.blockfrost | default dict).url) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_ENABLED" "value" $N.enabled) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_ORACLE_ENABLED" "value" ($N.oracle | default dict).enabled) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_ORACLE_URL" "value" ($N.oracle | default dict).url) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_CONFIG_POLICY_ID" "value" $NC.policyId) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_CONFIG_REF_UTXO_TX_HASH" "value" $NC.refUtxoTxHash) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_CONFIG_ASSET_NAME" "value" $NC.assetName) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_LM_CONFIG_POLICY_ID" "value" ($N.lmConfig | default dict).policyId) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_SMART_TOKENS_SPEND_SCRIPT_HASH" "value" $N.smartTokensSpendScriptHash) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_VERIFY_CONFIG_FAIL_ON_UNREACHABLE" "value" ($N.verifyConfig | default dict).failOnUnreachable) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_GENESIS_TX_HASH" "value" ($A.genesis | default dict).txHash) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_GENESIS_OUTPUT_INDEX" "value" ($A.genesis | default dict).outputIndex) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_STAKING_TOKEN_POLICY" "value" (($A.staking | default dict).token | default dict).policy) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_STAKING_TOKEN_NAME" "value" (($A.staking | default dict).token | default dict).name) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_TANK_REF_INPUT_TXHASH" "value" (($A.tank | default dict).refInput | default dict).txHash) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_TANK_REF_INPUT_OUTPUTINDEX" "value" (($A.tank | default dict).refInput | default dict).outputIndex) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_MODE" "value" $L.mode) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_ENABLED" "value" $L.enabled) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_IGNORE_PROFIT_CHECK" "value" $L.ignoreProfitCheck) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_CHECK_PROFITABILITY" "value" $L.checkProfitability) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_PROFIT_MARGIN_LOVELACE" "value" $L.profitMarginLovelace) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_MIN_EXPECTED_PROFIT_LOVELACE" "value" $L.minExpectedProfitLovelace) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_MIN_PROFIT_ABSOLUTE_LOVELACE" "value" $L.minProfitAbsoluteLovelace) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_DELAY_SECONDS" "value" $L.delaySeconds) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_VALIDITY_WINDOW_SECONDS" "value" $L.validityWindowSeconds) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_ORACLE_MARGIN_SECONDS" "value" $L.oracleWindowMarginSeconds) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_QUARANTINE_MINUTES" "value" $L.quarantineMinutes) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_DECISION_LOG_SIZE" "value" $L.decisionLogSize) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_LOAN" "value" $R.loan) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_LOAN_SPEND" "value" $R.loanSpend) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_LENDER_MANAGER" "value" $R.lenderManager) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_LENDER_MANAGER_SPEND" "value" $R.lenderManagerSpend) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_LOAN_CLAIM_ACTION" "value" $R.loanClaimAction) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_LM_LIQUIDATE_ACTION" "value" $R.lmLiquidateAction) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_LM_LIQUIDATE_AND_PAY_IN_ADVANCE_ACTION" "value" $R.lmLiquidateAndPayInAdvanceAction) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_LIQUIDATION_REF_ASSET_MANAGER" "value" $R.assetManager) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_SUBMITTABLE_NETWORK" "value" $N.submittableNetwork) }}
            {{- $MS := $N.minswap | default dict }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_MINSWAP_POOL_POLICY_ID" "value" $MS.poolPolicyId) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_MINSWAP_POOL_SPEND_SCRIPT_HASH" "value" $MS.poolSpendScriptHash) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_MINSWAP_ORDER_SPEND_SCRIPT_HASH" "value" $MS.orderSpendScriptHash) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_MINSWAP_POOL_ADDRESS" "value" $MS.poolAddress) }}
            {{- $CV := .Values.convert | default dict }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_LIQUIDATION_CONVERT_ENABLED" "value" $CV.enabled) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_LIQUIDATION_CONVERT_PROFIT_MARGIN_LOVELACE" "value" $CV.profitMarginLovelace) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_LIQUIDATION_CONVERT_DEX_COST_FLOOR_LOVELACE" "value" $CV.dexCostFloorLovelace) }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_LIQUIDATION_REFERENCE_SCRIPTS_LM_LIQUIDATE_AND_CONVERT_ACTION" "value" $R.lmLiquidateAndConvertAction) }}
            {{- /*
              Per-market policy, rendered to Spring's INDEXED relaxed-binding form.
              A list cannot be expressed as a typed scalar, and the indexed env
              names are the only shape the application binds from the environment.

              Validated HERE rather than at boot: an ANTICIPATE entry with no cap
              aborts the application's startup by design, so catching it at render
              turns a crash-loop into a refused upgrade. `cap` may legitimately be
              0-like, so it is tested with kindIs, never for truthiness.
            */}}
            {{- range $i, $m := .Values.markets }}
            {{- if not $m.unit }}
            {{- fail (printf "markets[%d] has no unit" $i) }}
            {{- end }}
            {{- if and $m.mode (not (has (toString $m.mode) (list "DISABLED" "SHADOW" "LIVE"))) }}
            {{- fail (printf "markets[%d].mode must be DISABLED|SHADOW|LIVE, got %q" $i (toString $m.mode)) }}
            {{- end }}
            {{- if and $m.action (not (has (toString $m.action) (list "CONVERT" "ANTICIPATE"))) }}
            {{- fail (printf "markets[%d].action must be CONVERT|ANTICIPATE, got %q" $i (toString $m.action)) }}
            {{- end }}
            {{- if and (eq (toString $m.action) "ANTICIPATE") (kindIs "invalid" $m.cap) }}
            {{- fail (printf "markets[%d] is action ANTICIPATE and has no cap; the application refuses to start without one" $i) }}
            {{- end }}
            {{- include "ft-aquarium-node.env" (dict "name" (printf "LOANS_LIQUIDATION_MARKETS_%d_UNIT" $i) "value" $m.unit) }}
            {{- include "ft-aquarium-node.env" (dict "name" (printf "LOANS_LIQUIDATION_MARKETS_%d_MODE" $i) "value" $m.mode) }}
            {{- include "ft-aquarium-node.env" (dict "name" (printf "LOANS_LIQUIDATION_MARKETS_%d_ACTION" $i) "value" $m.action) }}
            {{- include "ft-aquarium-node.env" (dict "name" (printf "LOANS_LIQUIDATION_MARKETS_%d_CAP" $i) "value" $m.cap) }}
            {{- end }}
            {{- include "ft-aquarium-node.env" (dict "name" "LOANS_UI_ENABLED" "value" ($N.ui | default dict).enabled) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_COMPOUND_ENABLED" "value" $C.enabled) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_COMPOUND_DELAY_SECONDS" "value" $C.delaySeconds) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_COMPOUND_PROFIT_MARGIN_LOVELACE" "value" $C.profitMarginLovelace) }}
            {{- include "ft-aquarium-node.env" (dict "name" "AQUARIUM_COMPOUND_REFERENCE_SCRIPTS" "value" $C.referenceScripts) }}
            {{- include "ft-aquarium-node.env" (dict "name" "SCHEDULING_TRANSACTION_PROCESSOR_DELAY_MINUTES" "value" (.Values.scheduling | default dict).transactionProcessorDelayMinutes) }}
            {{- include "ft-aquarium-node.env" (dict "name" "SPRING_TASK_SCHEDULING_POOL_SIZE" "value" (.Values.scheduling | default dict).taskPoolSize) }}
            {{- /*
              extraEnv stays permissive for anything the chart does not emit — the
              38th parameter arrives with the next application release and an
              operator must not be stuck until the chart catches up. But a key
              that DOES have a typed home is refused: Kubernetes takes the last
              duplicate, so extraEnv would silently beat a documented default and
              leave the reader with false confidence in the value they can see.
              Fail on COLLISION, not on USE.
            */}}
            {{- $typed := splitList "," (include "ft-aquarium-node.typedEnvNames" .) }}
            {{- range $k, $v := .Values.extraEnv }}
            {{- if has $k $typed }}
            {{- fail (printf "extraEnv sets %s, which has a typed values key in this chart. Set that key instead — extraEnv would silently override it." $k) }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- /*
            No readinessProbe. /healthcheck answers 200 with the body
            "...syncing..." during the initial sync, so no endpoint currently
            means "ready"; gating on one would restart-loop the pod through
            ~49 million slots of chain. See values.yaml and README.md.
          */}}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if $anyFile }}
          volumeMounts:
            - name: secrets
              mountPath: {{ $sec.mountPath }}
              readOnly: true
          {{- end }}
      {{- if $anyFile }}
      {{- /*
        A PROJECTED volume, not a plain secret volume — that is what lets three
        independently-named Secrets contribute files to ONE mount. The Spring
        config tree reads the directory, so it neither knows nor cares that the
        files arrived from different Secrets.

        `defaultMode: 0400` sits on the projection and applies to every source.
      */}}
      volumes:
        - name: secrets
          projected:
            defaultMode: 0400
            sources:
              {{- if $mnFile }}
              - secret:
                  name: {{ $mnName }}
                  items:
                    - key: {{ $mnKey }}
                      path: wallet.mnemonic
              {{- end }}
              {{- if $bfFile }}
              - secret:
                  name: {{ $bfName }}
                  items:
                    - key: {{ $bfKey }}
                      path: blockfrost.key
              {{- end }}
              {{- if $dbFile }}
              {{- /*
                ONE key, TWO files, on purpose. Flyway has its own password
                property, separate from the datasource; project only the
                datasource one and the application connects fine while the
                migration fails to authenticate — which reads as a bad secret
                and is not.
              */}}
              - secret:
                  name: {{ $dbName }}
                  items:
                    - key: {{ $dbKey }}
                      path: spring.datasource.password
                    - key: {{ $dbKey }}
                      path: spring.flyway.password
                    {{- if $dbUserFromSecret }}
                    {{- /*
                      ⚠ The username has the SAME two-property split as the
                      password, but the two properties are not named alike:
                      `spring.datasource.username` and `spring.flyway.user`.
                      Flyway's is `user`, not `username`. Project only the
                      datasource one and the application connects as the right
                      role while the MIGRATION connects as the default
                      `fluidtokens` — which fails as a permissions error and
                      reads as a broken migration rather than a wrong username.
                    */}}
                    - key: {{ $dbUserKey }}
                      path: spring.datasource.username
                    - key: {{ $dbUserKey }}
                      path: spring.flyway.user
                    {{- end }}
              {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
