apiVersion: v1
kind: Service
metadata:
  name: {{ include "ft-aquarium-node.fullname" . }}
  labels:
    {{- include "ft-aquarium-node.labels" . | nindent 4 }}
spec:
  {{- /*
    ClusterIP only. The node dials out to everything it needs — the relay,
    Blockfrost, the FluidTokens oracle — and nothing outside the cluster needs
    to reach it. This Service exists for the kubelet's probes and for
    Prometheus. There is no NodePort value and no Ingress template: see
    README.md, "No ingress, deliberately".
  */}}
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- /*
        NodePort only. Unset, Kubernetes assigns one and keeps it across
        upgrades; pinned, the URL is knowable in advance and survives the
        Service being recreated — at the cost that a collision fails the apply.
      */}}
      {{- if and (eq .Values.service.type "NodePort") (.Values.service.nodePort) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "ft-aquarium-node.selectorLabels" . | nindent 4 }}
