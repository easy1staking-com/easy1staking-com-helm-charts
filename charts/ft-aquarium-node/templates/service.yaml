apiVersion: v1
kind: Service
metadata:
  name: {{ include "ft-aquarium-node.fullname" . }}
  labels:
    {{- include "ft-aquarium-node.labels" . | nindent 4 }}
spec:
  {{- /*
    ClusterIP by DEFAULT. The node dials out to everything it needs — the
    relay, Blockfrost, the FluidTokens oracle — and nothing outside the cluster
    needs to reach it. This Service exists for the kubelet's probes and for
    Prometheus.

    Two ways to publish it, both opt-in and independent of each other:
    `type: NodePort` with the optional pin below, and (since 0.7.0) the
    ingress in ingress.yaml. Enabling one does not disable the other. See
    README.md, "Publishing the UI".
  */}}
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- /*
        NodePort only. Unset, Kubernetes assigns one and keeps it across
        upgrades; pinned, the URL is knowable in advance and survives the
        Service being recreated — at the cost that a collision fails the apply.
      */}}
      {{- if and (eq .Values.service.type "NodePort") (.Values.service.nodePort) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "ft-aquarium-node.selectorLabels" . | nindent 4 }}
