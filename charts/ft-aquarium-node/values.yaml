# Default values for the ft-aquarium-node chart.
#
# The Aquarium node is a Spring Boot service that indexes Cardano preview with
# yaci-store into Postgres, serves a read-only loans API, and runs the
# FluidTokens Lending v4 liquidation bot. It is a client of everything it talks
# to: it needs no inbound access from outside the cluster.
#
# Quick start:
#   helm template t ./charts/ft-aquarium-node
#   helm install  t ./charts/ft-aquarium-node -f ./charts/ft-aquarium-node/values-preview.yaml \
#     --set config.db.host=<pg> --set secret.name=<sealed-secret-name>
#
# See README.md before setting anything. Three things there will bite otherwise:
# the syncing-200, the two arming flags, and what losing the Postgres volume costs.

image:
  # FluidTokens' own Docker Hub build. We do not build or publish this image.
  repository: fluidtokens/ft-aquarium-node
  pullPolicy: IfNotPresent

  # Overrides the tag, whose default is the chart appVersion (2026.07.13).
  # Do not use "latest": it currently resolves to the same digest as
  # 2026.07.13, but a tag describes while a digest resolves, and "latest"
  # is free to move under you.
  tag: ""

  # Optional digest pin. When set, the image becomes `repository@digest` and the
  # tag is ignored — so setting both is refused at render rather than silently
  # resolving one of them.
  #
  # A digest is not repository-independent. It identifies a manifest inside one
  # repository. Point `repository` somewhere else — a mirror, a private registry,
  # your own rebuild — and this digest almost certainly does not exist there.
  # The chart cannot detect that, because it cannot know which repository a digest
  # came from; the failure surfaces later as an ImagePullBackOff naming a digest
  # nobody typed.
  #
  # **Empty by default, and that is a fix rather than an omission.** This chart
  # used to ship FluidTokens' published digest here. An operator who set
  # `repository` and `tag` to their own rebuild got that digest appended to their
  # repository and an image that could never exist. A default digest can only ever
  # be correct for one deployer.
  #
  # If you pin, pin a digest you resolved from the repository you configured.
  # For reference, FluidTokens' published `2026.07.13` is
  # sha256:3e016ea1aeb0cb38dda13ec29bb16a40f560abaf345378b7cb335fe9875eeb2a —
  # information, not a default.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# The image declares no user, so it runs as root today. There is no
# PersistentVolume on this pod, so unlike the amaru chart there is no fsGroup
# problem to solve here. Running non-root is untested against this image.
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  # Spring Boot default. The image sets no server.port. Everything is served
  # here: /healthcheck, /actuator/health, /actuator/prometheus, /api/v1/**.
  port: 8080

# Note: there is deliberately no ingress in this chart, and no ingress.enabled
# value. See README.md ("No ingress, deliberately"): the unauthenticated
# /api/v1 API and the Spring actuator share this one port, on a pod that holds a
# wallet seed. Reachability for debugging is `kubectl port-forward`.

# Sizing. These are now reported adequate for steady state from a real preview
# deployment that reached tip — the first evidence this chart has ever had.
#
# Do not size from the ~2.8Gi peak observed during that deployment's initial
# sync. That peak was the cursor-cleanup defect described under
# config.store.cardano, not a memory requirement: the fix is the cleanup
# interval, and sizing the limit to fit an unbounded delete only buys a larger
# sync before the same failure returns. A number taken from a pathology looks
# exactly like a measurement, which is how it becomes permanent.
#
# What remains genuinely unmeasured is the peak of a healthy initial sync, with
# the cleanup interval at 60. The original state of this comment follows,
# because it is still true of that number:
#
# There is no measured figure for this application — not "not tuned",
# but none. The compose file's JAVA_OPTS was never read by the entrypoint (see
# jvm.opts below), so every number derived from it, including the application
# repo's own suggestion, carries no weight. These are a deliberate starting
# point. The initial sync is the peak, and it is ~49 million slots: measure
# there, on the first real run, and correct these.
#
# Ceiling, and the reason this is a knob: the target node schedules by requests,
# and ~64% of its memory is already reserved by other workloads, leaving roughly
# 10Gi of request headroom. A namespace is an authorisation boundary, not a
# resource boundary on a single node — so a request that exceeds that headroom
# leaves the pod Pending regardless of which namespace it lands in. 512Mi is
# comfortably inside it; raise it deliberately, not reflexively.
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 1

# Passed to the JVM via JAVA_TOOL_OPTIONS.
#
# Not via JAVA_OPTS: the image's entrypoint is the exec form
# ["java","-jar","app.jar"], with no shell to expand a variable, so the
# JAVA_OPTS the compose file sets has never had any effect. JAVA_TOOL_OPTIONS is
# read by the JVM itself and does.
#
# MaxRAMPercentage rather than a fixed -Xmx so the heap tracks
# resources.limits.memory instead of silently diverging from it: 75% of the 1Gi
# limit is ~768Mi of heap, leaving ~256Mi for metaspace, code cache, thread
# stacks and direct buffers. A JVM whose heap does not fit inside the container
# limit is OOMKilled by the kernel, not by the JVM, and leaves no stack trace.
# 75 is the application authors' own recommendation; if the pod is OOMKilled
# without a Java OutOfMemoryError, non-heap is the overrun — lower this rather
# than raising the limit blindly.
jvm:
  opts: "-XX:MaxRAMPercentage=75"

# How long Kubernetes waits for a clean shutdown before sigkill.
# unverified: whether the node has in-flight transaction work that must not be
# torn in half has not been confirmed upstream. 60s is a conservative default.
terminationGracePeriodSeconds: 60

## Probes
#
# Read this before adding a readiness probe.
#
# /healthcheck returns HTTP 200 with the plain body "...syncing..." while the
# node is still syncing, and a JSON body only once it is caught up. A 200 from
# it therefore does not mean ready. There is currently no endpoint that means
# ready.
#
# The initial preview sync starts at slot 71,971,209 against a tip near
# 120,955,928 — roughly 49 million slots, about 567 days of chain. A liveness or
# readiness gate that fails while that runs restarts the pod, which restarts the
# sync, forever. That is why there is no readiness probe here and why liveness
# is on /actuator/health (Spring's own health: process and datasource) rather
# than on /healthcheck.
#
# The startupProbe is what makes a tight liveness probe safe: liveness does not
# begin until startup succeeds, so a slow Flyway migration on an empty database
# cannot be mistaken for a dead process.
startupProbe:
  # 60 x 10s = 10 minutes for the app to answer /actuator/health on an empty
  # database. unverified — the real boot-to-healthy time has not been measured.
  # Generous on purpose: too short here is a CrashLoopBackOff before the node
  # ever reaches its first block.
  httpGet:
    path: /actuator/health
    port: http
  periodSeconds: 10
  failureThreshold: 60
  timeoutSeconds: 5

livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  periodSeconds: 30
  failureThreshold: 5
  timeoutSeconds: 5

## App configuration
#
# Every value below is passed as an environment variable. Spring's relaxed
# binding maps them onto application.yaml keys.
config:
  # Tuning. [derived] → NETWORK
  # The application derives this from the active Spring profile. Setting it here
  # overrides that, so the profile and the network can disagree — leave it empty
  # unless you specifically mean to break that link.
  network: ""

  # Required by the application. `preview` is the only network this deployment
  # supports: the code hard-codes SUBMITTABLE_NETWORK to preview, so mainnet is
  # fail-closed regardless of configuration. There is deliberately no
  # values-mainnet.yaml in this chart.
  springProfile: preview

  # Postgres. consumed, never deployed — this chart creates no database.
  # See README.md: the durable volume the node depends on belongs to Postgres,
  # not to this pod, and losing it costs a full ~49M-slot re-index.
  db:
    driver: org.postgresql.Driver
    dialect: org.hibernate.dialect.PostgreSQLDialect
    host: ""
    port: 5432
    database: aquarium
    schema: public

    # The role that owns `database` above — not the superuser.
    #
    # This must be the same role the Secret's db-password belongs to. Get that
    # pairing wrong and the application presents the right password as the wrong
    # user, which Postgres reports as an authentication failure — so it reads as
    # a bad secret, and the secret is where everyone looks first. Defaulting this
    # to `postgres` made the superuser the thing you had to notice was wrong.
    #
    # Defaulting instead to the role of the same name as the database matches the
    # app-owned-database story the README tells, and it is also what Postgres 15+
    # needs: PG15 revoked create on the `public` schema from public, so Flyway's
    # startup migration needs a role that owns the database (which carries the
    # schema through pg_database_owner) or has been granted create on `public`
    # explicitly. A non-owning role fails at the first migration, not at connect.
    username: aquarium
    # The jdbc URL is composed from the five values above so it cannot drift
    # from them. Set this only to override that composition entirely.
    url: ""

  # Cardano relay to sync from, over node-to-node. The node dials out to this;
  # nothing dials in.
  #
  # Defaults to the public preview relay so the chart works out of the box. An
  # operator running their own relay should point this at it instead — and if
  # that relay is on the lan rather than the internet, the pod needs egress to
  # a private address range, which is not the default assumption anywhere.
  # A specific lan address is deployment state and does not belong in this
  # public chart; set it in your own values.
  store:
    cardano:
      host: preview-node.world.dev.cardano.org
      port: 3001

      # --- Cursor cleanup: undocumented upstream, and load-bearing ---
      #
      # Yaci-store's CursorCleanupScheduler deletes aged cursor rows with a
      # Spring Data derived delete (no @Modifying, no @Query), so every matching
      # row is loaded as a managed entity before deletion, in one transaction.
      # The working set is therefore whatever accumulated since the last run —
      # which makes the interval the lever, and the memory limit not.
      #
      # Neither property below appears anywhere in yaci-store's documentation.
      # They exist only in its source. That is why they are surfaced here: an
      # operator could not discover them.
      #
      # The failure this prevents, observed on this chart's first deploy: a
      # ~45-minute initial sync accumulated ~1.65M rows, the first post-sync
      # cleanup tried to materialise all of them at once, and the pod died of
      # OutOfMemoryError → GC thrash → liveness timeout → SIGTERM. Sixty times,
      # because the scheduler's 30s initialDelay meant every fresh pod
      # re-attempted the same oversized delete before it could make progress —
      # a self-perpetuating restart loop, not a flapping one.
      #
      # 60 rather than yaci-store's own default of 3600 — a deliberate
      # divergence. At 3600 a fresh sync presents its entire backlog to the
      # first run; at 60 the same sync drains a minute at a time, order ~36k
      # rows per run instead of 1.65M. No code change, reversible, and it costs
      # only a slightly more frequent small transaction.
      #
      # The honest limit: this bounds a sync that is still running. It does not
      # drain a backlog that already exists — a node that has already
      # accumulated the rows must survive one large delete regardless. So this
      # is prophylaxis for the next initial sync, which is the case that
      # matters: the margin in the observed incident was proportion, not design.
      # A modestly longer sync exceeds any limit you pick, and on mainnet this
      # recurs at a larger scale.
      #
      # Set to null to omit the variable and inherit yaci-store's 3600.
      cursorCleanupIntervalSeconds: 60

      # Rollback window, in blocks. Upstream default, deliberately unchanged.
      #
      # Do not set this to 0. Zero does not mean "keep nothing" — it disables
      # the cleanup bean entirely (@ConditionalOnExpression), trading a bounded
      # OOM for unbounded disk growth (~1.65M rows per 45 minutes of sync) and
      # surrendering the rollback window with it. It is honoured explicitly if
      # you set it — Helm's `with` would silently drop a 0 and this chart does
      # not use it — so nothing protects you from that choice but this comment.
      #
      # Set to null to omit the variable and inherit yaci-store's 2160.
      cursorNoOfBlocksToKeep: 2160

## Secrets
#
# Three, and only three: the wallet seed, the Blockfrost key and the Postgres
# password. Nothing else in this chart is a secret.
#
# This chart never creates a Secret and has no plaintext fallback — a deliberate
# divergence from the cardano-db-sync and midnight-node charts in this repo,
# which do offer one. Those guard a database password; this one guards a BIP-39
# wallet seed whose blast radius is total loss of that wallet's funds, in a
# repository that is public. A fallback path is a place for it to be typed.
#
# Leave `name` empty and the secrets are simply absent from the render — the
# application then fails at startup with a named error, which is correct.
# Create the Secret out of band (sealed-secrets is the mechanism in use).
secret:
  name: ""

  # How the secret reaches the process. Default `file`, and prefer it.
  #
  #   file — the Secret is mounted at `mountPath` with 0400 files named for the
  #          Spring properties, and read via SPRING_CONFIG_IMPORT config trees.
  #          An environment variable is visible in `kubectl describe pod`, in
  #          the pod spec and in Argo CD's UI; this process signs and submits
  #          transactions with that seed. A file is strictly better — and a file
  #          has no word-splitting, which removes the mnemonic quoting hazard at
  #          the root rather than warning about it.
  #
  #   env  — classic secretKeyRef environment variables. Kept because the
  #          config-tree path is reasoned, not booted against this image: it is
  #          Spring's documented behaviour, but nobody has started the app to
  #          watch it bind. If `file` mode fails with "wallet.mnemonic has no
  #          default", switch to `env` and the deployment proceeds while the
  #          question gets answered. Being wrong should be cheap, not blocking.
  #
  # Both modes read the same Secret with the same keys; only the projection
  # differs. Neither puts a secret in this repository.
  mode: file

  # Keys within the Secret. These are the key names, not the values.
  keys:
    walletMnemonic: wallet-mnemonic
    blockfrostKey: blockfrost-key
    dbPassword: db-password

  # File mode only. Files are named for the Spring properties they set:
  #   wallet.mnemonic
  #   blockfrost.key
  #   spring.datasource.password
  #   spring.flyway.password        <- Flyway has its own password property,
  #                                    separate from the datasource. The one
  #                                    db-password key feeds both; miss the
  #                                    second and the migration fails while the
  #                                    application itself connects fine.
  mountPath: /etc/aquarium-secrets


## The application's parameter surface
##
## Every key below is empty by default and emitted only when you set it. Empty
## means the chart says nothing and the image's own per-profile default governs
## — which is safer than the chart restating that default, because a restated
## default goes stale silently when the image moves.
##
## Each entry is marked:
##   Safety gate — loosening it can cause the node to spend funds, submit a
##                     transaction it should not, or run against the wrong
##                     contracts. Change deliberately, never to make something work.
##   Tuning       — wrong values cost throughput or noise, not money.
##
## And each carries its provenance, because the two are not equally certain:
##   [documented] the application's own application.yaml maps this exact env var
##   [derived]    reachable only through Spring's relaxed binding. The mapping is
##                asserted from Spring's documented behaviour and has not been
##                watched binding on this image. If a [derived] key appears to do
##                nothing, that is the first thing to suspect.

## Arming: three switches, not two.
##
## Submitting a liquidation burns a loan NFT and moves someone else's collateral.
##
## No values file in this repository may ever set an arming value: not `live`,
## not `true`, not commented-out-and-ready. This chart is public and installable
## by anyone; a preset that arms a transaction-signing bot arms it for everybody
## who runs `helm install` to see what it does. Arming is a deliberate act in the
## deploying operator's own values, outside this repo.
##
## Setting any of these restarts the pod, and restart is where the fatal boot
## verifiers run again (README §3). A node that has been up and quiet may not come
## back — that is the system working, not the arming failing.
liquidation:
  # Safety gate. [documented] → AQUARIUM_LIQUIDATION_MODE
  # "" | disabled | shadow | live
  #   disabled — the cycle does not run at all.
  #   shadow   — scans, builds, prices and records, but the MODE_NOT_LIVE veto
  #              stops submission. Nothing reaches the chain.
  #   live     — submits real transactions that spend real funds.
  # Requires `enabled` as well. An invalid value is refused at render.
  mode: ""

  # Safety gate. [documented] → AQUARIUM_LIQUIDATION_ENABLED
  # The second arming switch. `true` alone does nothing and `live` alone does
  # nothing; both are required, deliberately, so one flipped by accident is inert.
  enabled: ""

  # Safety gate. [documented] → AQUARIUM_LIQUIDATION_IGNORE_PROFIT_CHECK
  #
  # The third arming switch, and the one nobody expects. From the application's
  # own source: it "disables both profitability gates". Every candidate becomes
  # submittable regardless of whether the liquidation pays for its own
  # transaction — the node will spend to lose money.
  #
  # The application refuses to start with this true on mainnet, which is the
  # measure of what it is. Treat it as arming, not as tuning: an operator
  # reviewing `mode` and `enabled` and concluding the bot is bounded has checked
  # two of three.
  ignoreProfitCheck: ""

  ## Economics — loosening any of these admits liquidations that would otherwise
  ## be refused as unprofitable. Gates, not knobs.

  # Safety gate. [documented] → AQUARIUM_LIQUIDATION_CHECK_PROFITABILITY
  # Applies the absolute profit floor. `false` removes that gate entirely and
  # leaves only the margin lever.
  checkProfitability: ""

  # Safety gate. [documented] → AQUARIUM_LIQUIDATION_MIN_EXPECTED_PROFIT_LOVELACE
  # The margin-adjusted profit floor, and the second of two. A negative value
  # authorises the bot to spend its own ada, up to that amount per liquidation,
  # to move a borrower's collateral; losses worse than it are still refused.
  #
  # Both floors must be negative for a loss to get through. Setting only this one
  # changes nothing, because minProfitAbsoluteLovelace refuses a negative
  # floorProfit independently — the application logs which floor is still holding
  # rather than leaving that to be worked out.
  minExpectedProfitLovelace: ""

  # Safety gate. [documented] → AQUARIUM_LIQUIDATION_MIN_PROFIT_ABSOLUTE_LOVELACE
  # The absolute floor, tested before and independently of the margin — lowering
  # the margin can never rescue a candidate this refuses. Setting it negative is a
  # deliberate statement that mark-to-oracle economics are accepted, because a
  # convert liquidation fronts the principal in ADA and receives collateral in
  # tokens, and the floor compares ADA out against tokens in.
  minProfitAbsoluteLovelace: ""

  # Safety gate. [documented] → AQUARIUM_LIQUIDATION_PROFIT_MARGIN_LOVELACE
  # Expected profit = fee value - tx fee - this. Covers the reference-script
  # surcharge and refuses dust liquidations whose fee slice would not repay the
  # transaction claiming it. Lowering it admits smaller candidates.
  profitMarginLovelace: ""

  ## Timing — knobs. Wrong values cost throughput or silence, not money.

  # Tuning. [documented] → AQUARIUM_LIQUIDATION_DELAY_SECONDS
  delaySeconds: ""
  # Tuning. [documented] → AQUARIUM_LIQUIDATION_VALIDITY_WINDOW_SECONDS
  # Transaction validity window. Read with oracleWindowMarginSeconds: a candidate
  # is buildable only while this plus the margin still fits inside the feed's
  # remaining window.
  validityWindowSeconds: ""
  # Tuning. [documented] → AQUARIUM_LIQUIDATION_ORACLE_MARGIN_SECONDS
  # Required headroom between the feed's validity end and the transaction's.
  # Raising it shortens the usable stretch of every oracle window one second for
  # one; a value near the feed window disables the bot in practice while every
  # candidate merely reports ORACLE_WINDOW_MARGIN_TOO_SMALL — which reads as "no
  # candidates" rather than as a misconfiguration.
  oracleWindowMarginSeconds: ""
  # Tuning. [documented] → AQUARIUM_LIQUIDATION_QUARANTINE_MINUTES
  quarantineMinutes: ""
  # Tuning. [documented] → AQUARIUM_LIQUIDATION_DECISION_LOG_SIZE
  decisionLogSize: ""

  ## Published reference-script coordinates, `txHash#index` each.
  ##
  ## These decide buildability, not safety. A validator with a coordinate travels
  ## by reference; one without travels inline in the witness set. All-inline
  ## exceeds maxTxSize and cannot build, so at least one must be published.
  ##
  ## A coordinate whose on-chain script hash does not match the derived one is
  ## a hard startup failure, by design — a stale coordinate is worse than an
  ## absent one, and the verifier says so loudly rather than running the wrong
  ## script. Blank them on a redeploy rather than leaving them stale.
  referenceScripts:
    loan: ""                              # [documented] → …_REF_LOAN
    loanSpend: ""                         # [documented] → …_REF_LOAN_SPEND
    lenderManager: ""                     # [documented] → …_REF_LENDER_MANAGER
    lenderManagerSpend: ""                # [documented] → …_REF_LENDER_MANAGER_SPEND
    loanClaimAction: ""                   # [documented] → …_REF_LOAN_CLAIM_ACTION
    lmLiquidateAction: ""                 # [documented] → …_REF_LM_LIQUIDATE_ACTION
    lmLiquidateAndPayInAdvanceAction: ""  # [documented] → …_REF_LM_LIQUIDATE_AND_PAY_IN_ADVANCE_ACTION
    assetManager: ""                      # [documented] → …_REF_ASSET_MANAGER

## Lending v4 subsystem.
loans:
  # Safety gate. [documented] → LOANS_ENABLED
  # Master switch for indexing, scanning and health. Turning it OFF also disables
  # the two startup verifiers, so a node with wrong contract coordinates will
  # start quietly instead of refusing. Off is safe for the bot and removes a
  # correctness check; know which you wanted.
  enabled: ""

  oracle:
    # Tuning. [documented] → LOANS_ORACLE_ENABLED
    # Price-feed polling. OFF means every collateral reports health unavailable,
    # so nothing can be priced and the bot goes quiet rather than misbehaving.
    enabled: ""
    # Tuning. [documented] → LOANS_ORACLE_URL
    # Point it at the wrong network's registry and collaterals silently price as
    # unavailable — indistinguishable from "no candidates".
    url: ""

  ## Contract coordinates. Wrong values do not run the wrong contracts silently —
  ## LoansConfigVerifier derives every script hash from them and refuses to start
  ## on a mismatch. That refusal is the protection; do not disable it to "get
  ## past" a mismatch.
  config:
    policyId: ""        # [derived] → LOANS_CONFIG_POLICY_ID
    refUtxoTxHash: ""   # [derived] → LOANS_CONFIG_REF_UTXO_TX_HASH
    assetName: ""       # [derived] → LOANS_CONFIG_ASSET_NAME (hex; app default is "parameters")
  lmConfig:
    policyId: ""        # [derived] → LOANS_LM_CONFIG_POLICY_ID
  # [derived] → LOANS_SMART_TOKENS_SPEND_SCRIPT_HASH
  # Published in the ConfigDatum and not derivable from the blueprint; only the
  # pool-manager branch needs it.
  smartTokensSpendScriptHash: ""

  verifyConfig:
    # Safety gate. [derived] → LOANS_VERIFY_CONFIG_FAIL_ON_UNREACHABLE
    # Whether an unreachable backend fails the reference-script verifier at
    # startup. `false` (the application's default) tolerates unreachability and
    # starts anyway — which means the node can run without having verified its
    # scripts. A genuine hash mismatch is fatal either way; this governs only the
    # can't-tell case.
    #
    # "The verifier did not object" and "the verifier ran" are different
    # statements, and at the default you cannot tell them apart from a summary
    # line — the absence of a complaint is also what a skipped check looks like.
    # Look for positive evidence of a completed round trip: log lines reading
    # `Read ConfigDatum from <txHash>#0` and `Read LMConfigDatum from <txHash>#1`.
    # A verifier that skipped could not have read two datums off specific UTxOs.
    failOnUnreachable: ""

## Aquarium contract identity. Wrong values derive the wrong script tree; the
## startup verifiers are what catch that.
aquarium:
  genesis:
    txHash: ""       # [derived] → AQUARIUM_GENESIS_TX_HASH
    outputIndex: ""  # [derived] → AQUARIUM_GENESIS_OUTPUT_INDEX
  staking:
    token:
      policy: ""     # [derived] → AQUARIUM_STAKING_TOKEN_POLICY
      name: ""       # [derived] → AQUARIUM_STAKING_TOKEN_NAME
  tank:
    refInput:
      txHash: ""       # [derived] → AQUARIUM_TANK_REF_INPUT_TXHASH
      outputIndex: ""  # [derived] → AQUARIUM_TANK_REF_INPUT_OUTPUTINDEX

blockfrost:
  # Tuning. [derived] → BLOCKFROST_URL
  # Base URL only. The key is a secret and lives in the Secret above; it is not
  # settable here and never will be.
  url: ""

scheduling:
  # Tuning. [documented] → SCHEDULING_TRANSACTION_PROCESSOR_DELAY_MINUTES
  transactionProcessorDelayMinutes: ""
  # Tuning. [documented] → SPRING_TASK_SCHEDULING_POOL_SIZE
  # Scheduler threads. Spring's own default of 1 lets the transaction processor
  # starve the 30-second oracle refresh — observed as feeds ageing past expiry
  # exactly while transactions were being processed. The application corrects it
  # to 4; lowering it reintroduces that starvation.
  taskPoolSize: ""

## Extra environment variables — passthrough, and load-bearing.
#
# The contract coordinates the node derives its whole script tree from
# (aquarium.genesis.*, aquarium.config.policy-id, aquarium.lm-config.policy-id,
# and the liquidation reference-script coordinates) are baked into the image's
# preview profile, and that deployment has already been redeployed three times.
# Spring's relaxed binding means each of them is reachable by environment
# variable, so this map lets an operator follow a contract redeploy without
# waiting for a new image.
#
# DO not arm the bot from here. The arming flags have their own typed keys
# under `liquidation:` above, specifically so a reviewer can see them in a diff.
# Setting AQUARIUM_LIQUIDATION_MODE or _ENABLED through this map would work and
# would hide what it is doing, which is the reason it has a proper home.
extraEnv: {}
  # AQUARIUM_CONFIG_POLICY_ID: "c45d5306a7c0f7ba361af5fcdfa9bdbe0ba67f105caa2d2d4032aaa9"

## Optional init container that blocks until Postgres accepts tcp.
#
# Off by default, so the chart declares no image it does not need. With it off,
# an unreachable database means Flyway fails at startup and Kubernetes restarts
# the pod with backoff — noisy in the event log, but self-healing and correct.
# Turn it on if you would rather see one waiting init container than a
# CrashLoopBackOff.
waitForPostgres:
  enabled: false
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent

## ServiceMonitor for kube-prometheus-stack.
#
# Default OFF: a ServiceMonitor referencing a CRD that is not installed fails
# the whole install, and whether kube-prometheus-stack is present on the target
# cluster is the deployer's knowledge, not the chart's.
serviceMonitor:
  enabled: false
  releaseName: kube-prometheus-stack
  path: /actuator/prometheus
  interval: 30s
  scrapeTimeout: 10s

nodeSelector: {}
tolerations: []
affinity: {}
