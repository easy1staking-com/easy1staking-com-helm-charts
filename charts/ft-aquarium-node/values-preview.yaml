# Preview preset for the Aquarium node.
#
# The chart's defaults already target preview — this is the only network the
# application supports. These three keys are restated here rather than left
# implicit so that the meaning of "preview" cannot be changed by editing
# values.yaml: values files in this repo are OVERLAYS, and a key that quietly
# moves in the defaults moves everywhere that does not restate it.

config:
  springProfile: preview
  store:
    cardano:
      host: preview-node.world.dev.cardano.org
      port: 3001

# Reachable from Giovanni's laptop, on purpose. The liquidation readiness UI is
# served by this pod and is meant to be opened in a browser; this is a preview
# box on a trusted LAN.
#
# Not set in values.yaml, and this is the ONLY file that turns it on: see the
# NOTE there for what else port 8080 carries and why it is acceptable here.
#
# The port is PINNED rather than assigned, so the URL is knowable before the
# deploy and survives the Service being recreated. The trade is real and worth
# knowing: a pinned nodePort that another Service already holds fails the APPLY
# with "provided port is already allocated" — an assigned one cannot fail that
# way. 30080 is inside the default node-port range (30000-32767); a number
# outside it is refused by the API server.
service:
  type: NodePort
  nodePort: 30080

# The readiness UI.
#
#   LOANS_UI_ENABLED — the page itself. Default false in the application, so
#                      without this the controller bean does not exist at all
#                      and the route 404s.
#   LOANS_ENABLED    — the lending machinery the page READS. Belt and braces:
#                      the application's preview profile already defaults this
#                      to true (`${LOANS_ENABLED:true}`), so this pins the
#                      behaviour against a change to that default rather than
#                      switching anything on today. With it false the page
#                      renders "lending is disabled on this node" instead of
#                      failing, which is the application being deliberately
#                      legible — not a broken deploy.
#
# ⚠ Neither of these ARMS anything. Arming is `liquidation.*`, which is a
# separate decision with its own guard rails, and it is not set here.
extraEnv:
  LOANS_UI_ENABLED: "true"
  LOANS_ENABLED: "true"
