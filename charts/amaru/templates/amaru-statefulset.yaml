{{ range $attributes := .Values.nodes }}
{{ if $attributes.enabled }}
{{- /*
  Upstream peers: prefer the peerAddresses list, fall back to the legacy
  singular peerAddress so existing deployment values keep working.
  An empty list emits no --peer-address at all, which lets Amaru fall back to
  its built-in bootstrap peer, peer snapshot and ledger-derived peers.
*/ -}}
{{- $peers := list }}
{{- if $attributes.peerAddresses }}
{{- $peers = $attributes.peerAddresses }}
{{- else if $attributes.peerAddress }}
{{- $peers = list $attributes.peerAddress }}
{{- end }}
{{- $submitApi := $.Values.config.submitApi | default dict }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "amaru-{{ $attributes.name }}"
  labels:
    app: amaru
    app.kubernetes.io/name: amaru
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: {{ $.Release.Name }}
    name: {{ $attributes.name }}
spec:
  replicas: {{ $attributes.replicas }}
  serviceName: "amaru-{{ $attributes.name }}"
  selector:
    matchLabels:
      app: amaru
      name: {{ $attributes.name }}
      type: {{ $attributes.type }}
      network: {{ $.Values.network }}
  template:
    metadata:
      labels:
        app: amaru
        app.kubernetes.io/name: amaru
        app.kubernetes.io/component: node
        app.kubernetes.io/instance: {{ $.Release.Name }}
        name: {{ $attributes.name }}
        type: {{ $attributes.type }}
        network: {{ $.Values.network }}
    spec:
      {{- with $.Values.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      initContainers:
        - name: init
          command: [ "bash", "-x", "/configmap/init.sh" ]
          image: "{{ $attributes.repository | default $.Values.image.repository }}:{{ $attributes.imageTag | default $.Values.image.tag | default $.Chart.AppVersion }}"
          env:
            - name: SKIP_BOOTSTRAP
              value: {{ $attributes.sleep | default false | quote }}
            - name: NETWORK
              value: {{ $.Values.network }}
            - name: AMARU_LEDGER_DIR
              value: {{ $.Values.config.ledgerDir }}
            - name: AMARU_CHAIN_DIR
              value: {{ $.Values.config.chainDir }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          volumeMounts:
            - name: "amaru-{{ $attributes.name }}"
              mountPath: /data/db
            - name: "amaru-init"
              mountPath: /configmap
      containers:
        - name: amaru
          {{- if $attributes.sleep }}
          command: [ "/bin/bash", "-c", "--" ]
          args: [ "sleep 999999" ]
          {{- else }}
          command: [ "amaru" ]
          args:
            - "node"
            - "run"
            - "--network"
            - {{ $.Values.network | quote }}
            - "--ledger-dir"
            - {{ $.Values.config.ledgerDir | quote }}
            - "--chain-dir"
            - {{ $.Values.config.chainDir | quote }}
            {{- /* Inbound p2p listener. Bound to the same value that drives the
                   containerPort and every Service port, so the advertised port
                   can never drift from the real listen address. */}}
            - "--listen-address"
            - "0.0.0.0:{{ $attributes.port }}"
            {{- range $p := $peers }}
            - "--peer-address"
            - {{ $p | quote }}
            {{- end }}
            {{- if $.Values.config.noTui }}
            - "--no-tui"
            {{- end }}
            {{- if $.Values.config.migrateChainDb }}
            - "--migrate-chain-db"
            {{- end }}
            {{- /* Explicit nil checks, not `with`: 0 is a meaningful value here
                   (0 downstream peers = accept no inbound), and `with` would
                   silently drop it and fall back to Amaru's default. */}}
            {{- if not (kindIs "invalid" $.Values.config.upstreamPeers) }}
            - "--upstream-peers"
            - {{ $.Values.config.upstreamPeers | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $.Values.config.downstreamPeers) }}
            - "--downstream-peers"
            - {{ $.Values.config.downstreamPeers | quote }}
            {{- end }}
            {{- with $.Values.config.peerMix }}
            - "--peer-mix"
            - {{ . | quote }}
            {{- end }}
            {{- with $.Values.config.peerSnapshot }}
            - "--peer-snapshot"
            - {{ . | quote }}
            {{- end }}
            {{- if $submitApi.enabled }}
            - "--submit-api-address"
            - "0.0.0.0:{{ $submitApi.port }}"
            {{- end }}
          {{- end }}
          image: "{{ $attributes.repository | default $.Values.image.repository }}:{{ $attributes.imageTag | default $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
              {{- $collectorConfig := $attributes.otelCollector | default $.Values.otelCollector }}
              {{- if or $attributes.withOpenTelemetry $collectorConfig.enabled }}
            - name: AMARU_WITH_OPEN_TELEMETRY
              value: "true"
            - name: AMARU_OTLP_METRIC_URL
              {{- if $collectorConfig.enabled }}
              value: "http://localhost:{{ $collectorConfig.otlpHttpPort | default 4318 }}/v1/metrics"
              {{- else }}
              value: {{ $attributes.otlpMetricUrl | default "http://otel-collector-opentelemetry-collector.observe:4318/v1/metrics" }}
              {{- end }}
            - name: AMARU_OTLP_SPAN_URL
              {{- if $collectorConfig.enabled }}
              value: "http://localhost:{{ $collectorConfig.otlpGrpcPort | default 4317 }}"
              {{- else }}
              value: {{ $attributes.otlpSpanUrl | default "http://otel-collector-opentelemetry-collector.observe:4317" }}
              {{- end }}
            - name: AMARU_OTLP_SERVICE_NAME
              value: "amaru"
              {{- end }}
          ports:
            - name: node
              containerPort: {{ $attributes.port }}
            {{- if $submitApi.enabled }}
            - name: submit-api
              containerPort: {{ $submitApi.port }}
            {{- end }}
          {{- if not $attributes.sleep }}
          {{- /* Readiness only, deliberately: Amaru exposes no HTTP health
                 endpoint, and a liveness probe during a long bootstrap or
                 replay would restart-loop the pod. This reports "listening"
                 without ever killing a syncing node. */}}
          readinessProbe:
            tcpSocket:
              port: node
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
          {{- end }}
          {{- with $attributes.resources | default $.Values.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: "amaru-{{ $attributes.name }}"
              mountPath: /data/db
        {{- $collectorConfig := $attributes.otelCollector | default $.Values.otelCollector }}
        {{- if $collectorConfig.enabled }}
        - name: otel-collector
          image: "{{ dig "image" "repository" "otel/opentelemetry-collector-contrib" $collectorConfig }}:{{ dig "image" "tag" "latest" $collectorConfig }}"
          imagePullPolicy: {{ dig "image" "pullPolicy" "IfNotPresent" $collectorConfig }}
          args:
            - "--config=/etc/otel-collector/config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: {{ $collectorConfig.otlpGrpcPort | default 4317 }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ $collectorConfig.otlpHttpPort | default 4318 }}
              protocol: TCP
            - name: prometheus
              containerPort: {{ $collectorConfig.prometheusPort | default 9464 }}
              protocol: TCP
          {{- $collectorResources := dig "resources" dict $collectorConfig }}
          {{- if not $collectorResources }}
          {{- $collectorResources = dig "resources" dict $.Values.otelCollector }}
          {{- end }}
          {{- if $collectorResources }}
          resources:
{{ toYaml $collectorResources | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel-collector
              readOnly: true
        {{- end }}
      volumes:
        - name: amaru-init
          configMap:
            name: "amaru-init-{{ $.Release.Name }}"
        {{- $collectorConfig := $attributes.otelCollector | default $.Values.otelCollector }}
        {{- if $collectorConfig.enabled }}
        - name: otel-collector-config
          configMap:
            name: "otel-collector-{{ $.Release.Name }}-{{ $attributes.name }}"
        {{- end }}
      terminationGracePeriodSeconds: 180
  volumeClaimTemplates:
  - metadata:
      name: "amaru-{{ $attributes.name }}"
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if $attributes.storageClassName }}
      storageClassName: {{ $attributes.storageClassName }}
      {{- end }}
      resources:
        requests:
          storage: {{ $.Values.volumeSize }}
{{ end }}
{{ end }}
