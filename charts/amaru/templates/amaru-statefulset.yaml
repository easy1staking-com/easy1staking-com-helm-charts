{{ range $attributes := .Values.nodes }}
{{ if $attributes.enabled }}
{{- /*
  Node type: "relay" or "block-producer". Unset (null) means relay. Anything
  else fails the render naming the node, rather than reaching a label: a typo
  such as "bp" or "Relay" would otherwise render a node that is neither.
  Checked only for enabled nodes, so a disabled entry is never validated.
*/ -}}
{{- $type := $attributes.type }}
{{- if kindIs "invalid" $type }}
{{- $type = "relay" }}
{{- else if not (and (kindIs "string" $type) (has $type (list "relay" "block-producer"))) }}
{{- fail (printf "nodes[] entry %v: type must be \"relay\" or \"block-producer\" (unset means relay), got %s" $attributes.name (toJson $type)) }}
{{- end }}
{{- /*
  Replicas: 0 or 1. Unset (null) means 1; 0 pauses the node and keeps its
  volume. Each node is one Amaru with its own databases, so more than one
  replica is never a scale-out: add another nodes[] entry instead. Accepts a
  YAML number only (Helm hands it over as float64 or int64), never a string or
  a bool. Explicit nil check, not `default` or `with`: both treat 0 as unset
  and would silently turn a paused node back on.
*/ -}}
{{- $replicas := $attributes.replicas }}
{{- if kindIs "invalid" $replicas }}
{{- $replicas = 1 }}
{{- else if or (kindIs "float64" $replicas) (kindIs "int64" $replicas) (kindIs "int" $replicas) }}
{{- if not (or (eq (float64 $replicas) 0.0) (eq (float64 $replicas) 1.0)) }}
{{- fail (printf "nodes[] entry %v: replicas must be 0 or 1 (unset means 1), got %s" $attributes.name (toJson $replicas)) }}
{{- end }}
{{- $replicas = int64 $replicas }}
{{- else }}
{{- fail (printf "nodes[] entry %v: replicas must be 0 or 1 (unset means 1), got %s (%s)" $attributes.name (toJson $replicas) (kindOf $replicas)) }}
{{- end }}
{{- /*
  Upstream peers: prefer the peerAddresses list, fall back to the legacy
  singular peerAddress so existing deployment values keep working.
  An empty list emits no --peer at all, and Amaru then uses only its other
  peer-mix sources. It no longer falls back to a network bootstrap peer, although
  the image's own --peer help text still says it does (an upstream doc bug).
*/ -}}
{{- $peers := list }}
{{- if $attributes.peerAddresses }}
{{- $peers = $attributes.peerAddresses }}
{{- else if $attributes.peerAddress }}
{{- $peers = list $attributes.peerAddress }}
{{- end }}
{{- $submitApi := $.Values.config.submitApi | default dict }}
{{- /*
  OTEL_METRIC_EXPORT_INTERVAL, in milliseconds. Validated here rather than left
  to Amaru: it panics at startup on an empty or non-numeric value and takes 0 as
  a zero interval. Null keeps the chart's 30000. Accepts a YAML integer (Helm
  hands it over as float64 or int64) or a digit-only string.
*/ -}}
{{- $intervalKey := "config.otlpMetricExportIntervalMs" }}
{{- $intervalMs := $.Values.config.otlpMetricExportIntervalMs }}
{{- if kindIs "invalid" $intervalMs }}
{{- $intervalMs = 30000 }}
{{- else if kindIs "string" $intervalMs }}
{{- if not (regexMatch "^[0-9]{1,6}$" $intervalMs) }}
{{- fail (printf "%s must be whole milliseconds in 1000..120000, got %q" $intervalKey $intervalMs) }}
{{- end }}
{{- $intervalMs = atoi $intervalMs }}
{{- else if or (kindIs "float64" $intervalMs) (kindIs "int64" $intervalMs) (kindIs "int" $intervalMs) }}
{{- if ne (float64 $intervalMs) (float64 (int64 $intervalMs)) }}
{{- fail (printf "%s must be whole milliseconds in 1000..120000, got %v" $intervalKey $intervalMs) }}
{{- end }}
{{- $intervalMs = int64 $intervalMs }}
{{- else }}
{{- fail (printf "%s must be whole milliseconds in 1000..120000, got %v (%s)" $intervalKey $intervalMs (kindOf $intervalMs)) }}
{{- end }}
{{- if or (lt (int64 $intervalMs) 1000) (gt (int64 $intervalMs) 120000) }}
{{- fail (printf "%s must be whole milliseconds in 1000..120000, got %v" $intervalKey $intervalMs) }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "amaru-{{ $attributes.name }}"
  labels:
    app: amaru
    app.kubernetes.io/name: amaru
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: {{ $.Release.Name }}
    name: {{ $attributes.name }}
spec:
  replicas: {{ $replicas }}
  serviceName: "amaru-{{ $attributes.name }}"
  podManagementPolicy: OrderedReady
  {{- /*
    `type` is deliberately NOT in the selector, although it stays a pod label.
    A StatefulSet's selector is immutable, and a relay is meant to be flipped
    to block-producer in place, keeping its name and its volume. With `type`
    in the selector that flip is rejected by the API server and forces a
    delete. The headless and -int Services drop it too, though their
    selectors are mutable: they follow the pod set, so a flip keeps them
    selecting the pod. The -ext Service is the exception: it pins the literal
    `type: relay` (see amaru-svc.yaml), so that a stale NodePort Service can
    never select a block producer.
  */}}
  selector:
    matchLabels:
      app: amaru
      name: {{ $attributes.name }}
      network: {{ $.Values.network }}
  template:
    metadata:
      labels:
        app: amaru
        app.kubernetes.io/name: amaru
        app.kubernetes.io/component: node
        app.kubernetes.io/instance: {{ $.Release.Name }}
        name: {{ $attributes.name }}
        type: {{ $type }}
        network: {{ $.Values.network }}
    spec:
      {{- with $.Values.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      initContainers:
        - name: init
          command: [ "bash", "-x", "/configmap/init.sh" ]
          image: "{{ $attributes.repository | default $.Values.image.repository }}:{{ $attributes.imageTag | default $.Values.image.tag | default $.Chart.AppVersion }}"
          env:
            {{- /* LEDGER_DIR/CHAIN_DIR here and in mithril-sync are the scripts'
                   own variables, deliberately not AMARU_-prefixed: Amaru remaps
                   the legacy AMARU_LEDGER_DIR/AMARU_CHAIN_DIR onto its current
                   names, so under those names Amaru itself would read them. */}}
            - name: SKIP_BOOTSTRAP
              value: {{ $attributes.sleep | default false | quote }}
            - name: DATA_DIR
              value: {{ $.Values.config.dataDir }}
            - name: NETWORK
              value: {{ $.Values.network }}
            - name: LEDGER_DIR
              value: {{ $.Values.config.ledgerDir }}
            - name: CHAIN_DIR
              value: {{ $.Values.config.chainDir }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: "amaru-{{ $attributes.name }}"
              mountPath: {{ $.Values.config.dataDir }}
            - name: "amaru-init"
              mountPath: /configmap
            - name: amaru-workdir
              mountPath: /var/lib/amaru
            - name: amaru-tmp
              mountPath: /tmp
        {{- if $.Values.config.mithrilSync.enabled }}
        {{- /* Runs after the bootstrap init container, never in parallel:
               mithril sync refuses to run against a non-bootstrapped node. */}}
        - name: mithril-sync
          command: [ "bash", "-x", "/mithril/mithril-sync.sh" ]
          image: "{{ $attributes.repository | default $.Values.image.repository }}:{{ $attributes.imageTag | default $.Values.image.tag | default $.Chart.AppVersion }}"
          env:
            - name: SKIP_BOOTSTRAP
              value: {{ $attributes.sleep | default false | quote }}
            - name: DATA_DIR
              value: {{ $.Values.config.dataDir }}
            - name: NETWORK
              value: {{ $.Values.network }}
            - name: LEDGER_DIR
              value: {{ $.Values.config.ledgerDir }}
            - name: CHAIN_DIR
              value: {{ $.Values.config.chainDir }}
            - name: MITHRIL_SNAPSHOTS_DIR
              value: {{ $.Values.config.mithrilSync.snapshotsDir }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: "amaru-{{ $attributes.name }}"
              mountPath: {{ $.Values.config.dataDir }}
            - name: "amaru-mithril"
              mountPath: /mithril
            - name: amaru-workdir
              mountPath: /var/lib/amaru
            - name: amaru-tmp
              mountPath: /tmp
        {{- end }}
      containers:
        - name: amaru
          {{- if $attributes.sleep }}
          command: [ "/bin/bash", "-c", "--" ]
          args: [ "sleep 999999" ]
          {{- else }}
          command: [ "amaru" ]
          args:
            - "node"
            - "run"
            - "--network"
            - {{ $.Values.network | quote }}
            - "--db-ledger"
            - {{ $.Values.config.ledgerDir | quote }}
            - "--db-chain"
            - {{ $.Values.config.chainDir | quote }}
            {{- /* Inbound p2p listener. Bound to the same value that drives the
                   containerPort and every Service port, so the advertised port
                   can never drift from the real listen address. */}}
            - "--peers-listen-on"
            - "0.0.0.0:{{ $attributes.port }}"
            {{- range $p := $peers }}
            - "--peer"
            - {{ $p | quote }}
            {{- end }}
            {{- if $.Values.config.noTui }}
            - "--tui-off"
            {{- end }}
            {{- if $.Values.config.migrateChainDb }}
            - "--db-chain-automatic-migration"
            {{- end }}
            {{- /* Explicit nil checks, not `with`: 0 is a meaningful value here
                   (0 downstream peers = accept no inbound), and `with` would
                   silently drop it and fall back to Amaru's default. */}}
            {{- if not (kindIs "invalid" $.Values.config.upstreamPeers) }}
            - "--peers-max-upstream"
            - {{ $.Values.config.upstreamPeers | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $.Values.config.downstreamPeers) }}
            - "--peers-max-downstream"
            - {{ $.Values.config.downstreamPeers | quote }}
            {{- end }}
            {{- with $.Values.config.peerMix }}
            - "--peers-mix"
            - {{ . | quote }}
            {{- end }}
            {{- with $.Values.config.peerSnapshot }}
            - "--peers-snapshot"
            - {{ . | quote }}
            {{- end }}
            {{- if $submitApi.enabled }}
            - "--submit-api-listen-on"
            - "0.0.0.0:{{ $submitApi.port }}"
            {{- end }}
          {{- end }}
          image: "{{ $attributes.repository | default $.Values.image.repository }}:{{ $attributes.imageTag | default $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
              {{- $collectorConfig := $attributes.otelCollector | default $.Values.otelCollector }}
              {{- if or $attributes.withOpenTelemetry $collectorConfig.enabled }}
            {{- /*
              AMARU_LOG_OTLP=true is what turns export on, for every signal
              (it can instead name signals). It replaces
              AMARU_WITH_OPEN_TELEMETRY, the old name, which Amaru still remaps.
              The endpoint, however, is NOT an AMARU_ variable: this binary
              contains no AMARU_OTLP_* string at all, and reads the standard
              OpenTelemetry SDK environment instead. The three AMARU_OTLP_*
              variables this chart used to set were introduced in 2025-12
              against appVersion 0.0.1-alpha.1 and have been silently ignored
              ever since; export reached the sidecar only because the SDK's
              default endpoint happens to be localhost:4317.

              gRPC on 4317 measured as the transport actually carrying every
              signal, so one endpoint variable suffices — no signal-specific
              pair and no OTEL_EXPORTER_OTLP_PROTOCOL. otlpGrpcPort is now a
              real knob; before this it moved the collector's listener while
              the exporter kept sending to the default, killing telemetry
              silently.
            */}}
            - name: AMARU_LOG_OTLP
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              {{- if $collectorConfig.enabled }}
              value: "http://localhost:{{ $collectorConfig.otlpGrpcPort | default 4317 }}"
              {{- else }}
              value: {{ $attributes.otlpEndpoint | default "http://otel-collector-opentelemetry-collector.observe:4317" | quote }}
              {{- end }}
            - name: OTEL_SERVICE_NAME
              value: "amaru"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ $intervalMs | quote }}
              {{- end }}
          ports:
            - name: node
              containerPort: {{ $attributes.port }}
            {{- if $submitApi.enabled }}
            - name: submit-api
              containerPort: {{ $submitApi.port }}
            {{- end }}
          {{- if not $attributes.sleep }}
          {{- /* Readiness only, deliberately: Amaru exposes no HTTP health
                 endpoint, and a liveness probe during a long bootstrap or
                 replay would restart-loop the pod. This reports "listening"
                 without ever killing a syncing node. */}}
          readinessProbe:
            tcpSocket:
              port: node
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
          {{- end }}
          {{- with $attributes.resources | default $.Values.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: "amaru-{{ $attributes.name }}"
              mountPath: {{ $.Values.config.dataDir }}
            - name: amaru-workdir
              mountPath: /var/lib/amaru
            - name: amaru-tmp
              mountPath: /tmp
        {{- $collectorConfig := $attributes.otelCollector | default $.Values.otelCollector }}
        {{- if $collectorConfig.enabled }}
        - name: otel-collector
          image: "{{ dig "image" "repository" "otel/opentelemetry-collector-contrib" $collectorConfig }}:{{ dig "image" "tag" "latest" $collectorConfig }}"
          imagePullPolicy: {{ dig "image" "pullPolicy" "IfNotPresent" $collectorConfig }}
          args:
            - "--config=/etc/otel-collector/config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: {{ $collectorConfig.otlpGrpcPort | default 4317 }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ $collectorConfig.otlpHttpPort | default 4318 }}
              protocol: TCP
            - name: prometheus
              containerPort: {{ $collectorConfig.prometheusPort | default 9464 }}
              protocol: TCP
          {{- $collectorResources := dig "resources" dict $collectorConfig }}
          {{- if not $collectorResources }}
          {{- $collectorResources = dig "resources" dict $.Values.otelCollector }}
          {{- end }}
          {{- if $collectorResources }}
          resources:
{{ toYaml $collectorResources | indent 12 }}
          {{- end }}
          {{- /*
            The shared containerSecurityContext, with the uid/gid overridden to
            10001: the collector image's own USER, which it declares as a number.
            Without this the sidecar would inherit the pod's 10000, Amaru's user.
            It mounts no emptyDir: it starts and runs read-only without one.
            deepCopy so the merge never writes back into .Values, which every
            node in the range shares.
          */}}
          {{- $sidecarSecurityContext := mergeOverwrite (deepCopy ($.Values.containerSecurityContext | default dict)) (dict "runAsUser" 10001 "runAsGroup" 10001) }}
          securityContext:
{{ toYaml $sidecarSecurityContext | indent 12 }}
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel-collector
              readOnly: true
        {{- end }}
      volumes:
        - name: amaru-init
          configMap:
            name: "amaru-init-{{ $.Release.Name }}"
        {{- /*
          Scratch space for the read-only root filesystem, mounted in init,
          mithril-sync and amaru (sleep included). /var/lib/amaru is the image
          WORKDIR: `amaru node bootstrap` writes its downloaded archives there,
          CWD-relative (about 0.9 GiB on preview). They are ephemeral exactly as
          before; nothing reads them after bootstrap. This is node ephemeral
          storage, not the PersistentVolume: the databases still go to
          config.dataDir.
        */}}
        - name: amaru-workdir
          emptyDir: {}
        - name: amaru-tmp
          emptyDir: {}
        {{- if $.Values.config.mithrilSync.enabled }}
        - name: amaru-mithril
          configMap:
            name: "amaru-mithril-{{ $.Release.Name }}"
        {{- end }}
        {{- $collectorConfig := $attributes.otelCollector | default $.Values.otelCollector }}
        {{- if $collectorConfig.enabled }}
        - name: otel-collector-config
          configMap:
            name: "otel-collector-{{ $.Release.Name }}-{{ $attributes.name }}"
        {{- end }}
      terminationGracePeriodSeconds: 180
  volumeClaimTemplates:
  - metadata:
      name: "amaru-{{ $attributes.name }}"
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if $attributes.storageClassName }}
      storageClassName: {{ $attributes.storageClassName }}
      {{- end }}
      {{- /*
        Size derived from `network` unless volumeSize overrides it. Derived
        rather than defaulted because GitOps consumers supply values INLINE and
        never read values-<network>.yaml — a size living only in that file gave
        them mainnet sizing on preview with no warning. Unknown networks fall
        back to the mainnet figure, which is the safe direction.
      */}}
      {{- $size := $.Values.volumeSize | default (index ($.Values.volumeSizeByNetwork | default dict) ($.Values.network | toString)) | default "250Gi" }}
      resources:
        requests:
          storage: {{ $size }}
{{ end }}
{{ end }}
