{{ range $attributes := .Values.nodes }}
{{ if $attributes.enabled }}
{{- $collectorConfig := $attributes.otelCollector | default $.Values.otelCollector }}
{{- $submitApi := $.Values.config.submitApi | default dict }}
{{- $isBp := eq (toString $attributes.type) "block-producer" }}
{{- /*
  Three services per relay, mirroring the cardano-node chart:
    amaru-<name>       headless  — stable per-pod DNS for the p2p port
    amaru-<name>-int   ClusterIP — ordinary in-cluster access
    amaru-<name>-ext   NodePort  — optional external inbound, only when nodePort is set

  Amaru has no node-to-client socket, so the only inbound listener is the p2p
  port (plus the optional HTTP submit API). It has no Prometheus endpoint of its
  own either: the scrape target is the otel-collector sidecar.

  A block producer gets the first two only, and no submit-api port on -int: it
  runs no submit API. It never gets -ext, because the StatefulSet template
  refuses a nodePort on a block producer.
*/ -}}
---
apiVersion: v1
kind: Service
metadata:
  name: amaru-{{ $attributes.name }}
  labels:
    app: amaru
    app.kubernetes.io/name: amaru
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  selector:
    app: amaru
    name: {{ $attributes.name }}
    network: {{ $.Values.network }}
  ports:
    - protocol: TCP
      name: node
      port: {{ $attributes.port }}
      targetPort: node
  clusterIP: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: amaru-{{ $attributes.name }}-int
  labels:
    app: amaru
    app.kubernetes.io/name: amaru
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  selector:
    app: amaru
    name: {{ $attributes.name }}
    network: {{ $.Values.network }}
  ports:
    - protocol: TCP
      name: node
      port: {{ $attributes.port }}
      targetPort: node
    {{- if and $submitApi.enabled (not $isBp) }}
    - protocol: TCP
      name: submit-api
      port: {{ $submitApi.port }}
      targetPort: submit-api
    {{- end }}
    {{- if $collectorConfig.enabled }}
    - protocol: TCP
      name: otel-prom
      port: {{ $collectorConfig.prometheusPort | default 9464 }}
      targetPort: prometheus
    {{- end }}
  type: ClusterIP
{{ if $attributes.nodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: amaru-{{ $attributes.name }}-ext
  labels:
    app: amaru
    app.kubernetes.io/name: amaru
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  {{- /*
    Pinned to the literal `type: relay`, not the node's type, unlike the two
    Services above, which carry no `type` at all. If a relay with a nodePort
    is flipped to block-producer and its nodePort removed, this Service stops
    rendering but may survive in the cluster: an Argo app with `prune: false`
    never deletes it, and neither does a `kubectl apply` of a `helm template`
    render. Pinned to relay, such a stale Service selects nothing rather than
    exposing the block producer.
  */}}
  selector:
    app: amaru
    name: {{ $attributes.name }}
    type: relay
    network: {{ $.Values.network }}
  ports:
    - protocol: TCP
      name: node
      port: {{ $attributes.port }}
      targetPort: node
      nodePort: {{ $attributes.nodePort }}
    {{- if and $submitApi.enabled $attributes.submitApiNodePort }}
    - protocol: TCP
      name: submit-api
      port: {{ $submitApi.port }}
      targetPort: submit-api
      nodePort: {{ $attributes.submitApiNodePort }}
    {{- end }}
  type: NodePort
{{ end }}
{{ end }}
{{ end }}
