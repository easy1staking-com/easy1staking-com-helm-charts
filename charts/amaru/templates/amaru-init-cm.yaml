apiVersion: v1
kind: ConfigMap
metadata:
  name: "amaru-init-{{ .Release.Name }}"
  labels:
    app: amaru
    app.kubernetes.io/name: amaru
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  init.sh: |
    set -o pipefail

    # ext4 PersistentVolumes come with a root-owned lost+found that Amaru trips
    # over. Removing it is best-effort: it is not fatal if the filesystem does
    # not have one, or if permissions do not allow it.
    rm -rf /data/db/lost+found || true

    # Bootstrap imports a ledger snapshot, bootstrap headers and nonces in one
    # step, downloading them from the Amaru snapshot bucket. It is skipped once
    # the databases exist, so restarts and upgrades do not re-download.
    if [[ ! -e "${AMARU_LEDGER_DIR}" ]] && [[ ! -e "${AMARU_CHAIN_DIR}" ]] && [[ "${SKIP_BOOTSTRAP}" == "false" ]]
    then
      amaru node bootstrap \
        --network="${NETWORK}" \
        --ledger-dir "${AMARU_LEDGER_DIR}" \
        --chain-dir "${AMARU_CHAIN_DIR}"
    fi
