apiVersion: v2
name: blockfrost
description: >-
  A Blockfrost API stack that needs no Cardano node of its own: blockfrost-platform
  in solitary mode, backed by a Dolos data node, attached to an existing node over
  two coordinates (n2n for Dolos sync, n2c via a socat TCP bridge for the Platform).

type: application

# Chart version — this chart's own semver. Bump on every chart change.
# NOTE: bumping this in a commit to `main` publishes the chart immediately via
# chart-releaser. That bump is the release gate and belongs to Giovanni.
version: 0.1.0-alpha.1

# TWO IMAGES, ONE appVersion. appVersion tracks blockfrost-platform, the API this
# chart exists to serve. The second image, Dolos, is pinned independently in
# values.yaml at `dolos.image` — ghcr.io/txpipe/dolos v1.6.1 — and a Dolos bump
# does not move appVersion. Both images are pinned by digest in values.yaml.
appVersion: "1.0.0"

# Native sidecars (initContainers[].restartPolicy: Always, used for socat) are on
# by default from Kubernetes 1.29. On an older API server socat would run as a
# blocking init container that never exits, and the Platform pod would never start.
kubeVersion: ">=1.29.0-0"
