# nodes: the chart ships no default list. Each entry may set the optional
# `externalTrafficPolicy` (Cluster | Local; not validated by the chart):
#
#   nodes:
#     - name: relay-1
#       nodePort: 30000
#       externalTrafficPolicy: Local
#
# It is applied only to the cardano-node-<name>-ext NodePort Service, never to
# the headless, -int or -socat Services. Unset, nothing is rendered and
# Kubernetes uses its default, Cluster, which SNATs every inbound peer so the
# node sees a cluster address. Local preserves the peer's source IP, because
# kube-proxy does not SNAT it. Before setting Local:
#   - A cluster node that does not run the pod drops the traffic. Irrelevant on
#     a single-node cluster; on multi-node, peers must target the pod's node.
#   - -ext carries only the node (n2n) port, so that is all it applies to. The
#     prom and socat ports are on the in-cluster -int Service only.
#   - A NodePort Service gets no healthCheckNodePort (only LoadBalancer does),
#     so an external load balancer in front of the NodePorts must health-check
#     each node itself.
#
# Per-node socat keys (the node socket, n2c, over TCP):
#   - socatEnabled / socatPort: a relay-only sidecar that exposes n2c inside
#     the cluster, on the cardano-node-<name>-int Service at socatPort.
#   - socatNodePortEnabled: opt-in, default false. When true on a relay with
#     socatEnabled, a cardano-node-<name>-socat NodePort Service publishes n2c.
#     It must be a YAML boolean: a quoted "false" or "true" is refused.
#   - socatNodePort: optional, and only with socatNodePortEnabled: true. It pins
#     the node port (30000-32767); empty means Kubernetes allocates one. Set
#     without the flag, the render fails rather than silently dropping n2c.
# A NodePort is reachable on every host address, whatever ufw says: on k3s,
# kube-proxy DNATs the traffic before ufw sees it.
