{{ range $attributes := .Values.nodes }}
{{ if $attributes.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: cardano-node-{{ $attributes.name }}
  labels:
    app: cardano-node
spec:
  selector:
    app: cardano-node
    name: {{ $attributes.name }}
    type: {{ $attributes.type }}
    network: {{ $.Values.network }}
  ports:
    - protocol: TCP
      name: node
      port: {{ $attributes.port }}
      targetPort: node
  clusterIP: None
  type: ClusterIP
{{ if $attributes.nodePort }}
{{- /* -ext carries only the n2n port: on k3s a NodePort is DNATed before ufw sees it, so prom and socat stay on -int. */}}
---
apiVersion: v1
kind: Service
metadata:
  name: cardano-node-{{ $attributes.name }}-ext
  labels:
    app: cardano-node
spec:
  selector:
    app: cardano-node
    name: {{ $attributes.name }}
    type: {{ $attributes.type }}
    network: {{ $.Values.network }}
  ports:
    - protocol: TCP
      name: node
      port: {{ $attributes.port }}
      targetPort: node
      nodePort: {{ $attributes.nodePort }}
  type: NodePort
  {{- with $attributes.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cardano-node-{{ $attributes.name }}-int
  labels:
    app: cardano-node
spec:
  selector:
    app: cardano-node
    name: {{ $attributes.name }}
    type: {{ $attributes.type }}
    network: {{ $.Values.network }}
  ports:
    - protocol: TCP
      name: node
      port: {{ $attributes.port }}
      targetPort: node
    - protocol: TCP
      name: prom
      port: {{ $attributes.prometheusPort | default 12798 }}
      targetPort: prom
    {{- if $attributes.socatEnabled }}
    - protocol: TCP
      name: socat
      port: {{ $attributes.socatPort }}
      targetPort: socat
    {{- end }}
  type: ClusterIP
{{- /* Refuse rather than drop: a pin without the flag would otherwise lose n2c access silently on upgrade. */}}
{{- if and $attributes.socatNodePort (not $attributes.socatNodePortEnabled) }}
{{- fail (printf "nodes[%s]: socatNodePort is set but socatNodePortEnabled is not true; set socatNodePortEnabled: true to keep the socat NodePort, or remove socatNodePort" $attributes.name) }}
{{- end }}
{{ if and $attributes.socatNodePortEnabled $attributes.socatEnabled (eq $attributes.type "relay") }}
---
apiVersion: v1
kind: Service
metadata:
  name: cardano-node-{{ $attributes.name }}-socat
  labels:
    app: cardano-node
spec:
  selector:
    app: cardano-node
    name: {{ $attributes.name }}
    type: {{ $attributes.type }}
    network: {{ $.Values.network }}
  ports:
    - protocol: TCP
      name: socat
      port: {{ $attributes.socatPort }}
      targetPort: socat
      {{- with $attributes.socatNodePort }}
      nodePort: {{ . }}
      {{- end }}
  type: NodePort
{{ end }}
{{ end }}
{{ end }}
