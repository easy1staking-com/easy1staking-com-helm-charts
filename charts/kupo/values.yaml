# Default values for kupo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: "cardanosolutions/kupo"
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 1442

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

## App Config

# Kupo can source the chain either directly from a cardano-node (default) or
# from an Ogmios instance. The two modes are mutually exclusive; node mode takes
# priority and is used unless ogmios.enabled is set to true.
#
# - Node mode (ogmios.enabled: false): Kupo connects via --node-socket/--node-config,
#   using the socat sidecar + config init container below.
# - Ogmios mode (ogmios.enabled: true): Kupo connects via --ogmios-host/--ogmios-port.
#   The socat sidecar, config init container and related volumes are dropped.
ogmios:
  enabled: false
  host: ""
  port: 1337

nodeSocketPath: "/node-ipc/node.socket"

socat:
  host: ""
  port: 0

volumeSize: 20Gi

cardano:
  node:
    image:
      repository: ghcr.io/intersectmbo/cardano-node
      tag: 9.1.1
