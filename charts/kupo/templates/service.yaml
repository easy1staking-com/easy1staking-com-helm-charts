apiVersion: v1
kind: Service
metadata:
  name: {{ include "kupo.fullname" . }}
  labels:
    {{- include "kupo.labels" . | nindent 4 }}
spec:
  {{- /* Unlike ogmios, which drops a pin outside NodePort silently, kupo refuses it with ClusterIP and honours it for LoadBalancer. */}}
  {{- if and .Values.service.nodePort (eq .Values.service.type "ClusterIP") }}
  {{- fail "service.nodePort is set but service.type is ClusterIP, and a ClusterIP Service has no node port: set service.type to NodePort or LoadBalancer, or unset service.nodePort" }}
  {{- end }}
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and .Values.service.nodePort (ne .Values.service.type "ClusterIP") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kupo.selectorLabels" . | nindent 4 }}
