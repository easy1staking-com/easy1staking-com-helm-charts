{{- /*
  heimdall.toml as a SECRET, never a ConfigMap.

  It carries `blockfrost_project_id`, which is a credential — the same reason the
  upstream Debian package installs this file 0640 root:heimdall. A ConfigMap
  would put it in plain sight of anyone with namespace read.

  ⛔ `cardano.mnemonic` IS NEVER EMITTED HERE, under any values, and there is no
  chart key that could produce it. The binary reads $HEIMDALL_MNEMONIC only when
  that TOML key is ABSENT, so its absence is not an omission — it is the
  mechanism that activates the env var.

  ⚠ TOML SECTION LAYOUT IS INFERRED, NOT VERIFIED — see README, "The one thing
  that needs checking before this is deployed".
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heimdall.fullname" . }}-config
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
type: Opaque
stringData:
  heimdall.toml: |
    {{- /*
      bind_address MUST be 0.0.0.0 in a container: loopback is unreachable from
      outside the netns even with a published port. This stays 0.0.0.0 behind an
      ingress too — reachability is decided by the Service and Ingress, never by
      narrowing the bind.
    */}}
    [http]
    bind_address = "0.0.0.0"
    listen_port = {{ include "heimdall.num" (include "heimdall.listenPort" . | float64) }}

    [cardano]
    network = {{ required "heimdall: config.network is REQUIRED and has no default. heimdall refuses to start without it, and an UNRESOLVABLE network is TREATED AS MAINNET — a typo does not fall back to preprod, it falls forward onto real funds." .Values.config.network | quote }}
    {{- /*
      ⛔ `blockfrost_project_id` IS DELIBERATELY ABSENT FROM THIS FILE.

      It is a credential, and this chart renders no credential into its own
      output — not from values, not from --set, which would land it in the
      release's stored manifest either way. It is referenced as a Secret
      (blockfrost.secretName/secretKey) and injected as BLOCKFROST_PROJECT_ID.

      ⚠ THIS ASSUMES THE DAEMON READS IT FROM THE ENVIRONMENT, which is NOT yet
      confirmed. If it turns out to be TOML-only, THIS IS THE ONE PLACE THAT
      CHANGES: the file gets a placeholder and is assembled at container start
      from the same env var. The values surface does not move either way.
    */}}
    {{- with .Values.config.blockfrostUrl }}
    blockfrost_url = {{ . | quote }}
    {{- end }}

    [bifrost]
    skey_path = {{ .Values.config.skeyPath | quote }}
    config_address = {{ required "heimdall: config.configAddress is REQUIRED and has no default." .Values.config.configAddress | quote }}
    config_nft_policy_id = {{ required "heimdall: config.configNftPolicyId is REQUIRED and has no default." .Values.config.configNftPolicyId | quote }}
    stake_source = {{ required "heimdall: config.stakeSource is REQUIRED and has no default." .Values.config.stakeSource | quote }}
    min_stake_lovelace = {{ include "heimdall.num" (required "heimdall: config.minStakeLovelace is REQUIRED and has no default." .Values.config.minStakeLovelace) }}
    {{- /*
      Demo values are a ROSTER-WIDE agreement and are refused on mainnet. Emitted
      only when explicitly set: a default would not just be wrong for one node,
      it would SPLIT THE ROSTER, because nodes disagreeing on demo stake compute
      different rosters and stop signing together.
    */}}
    {{- if not (kindIs "invalid" .Values.config.demoLiveStake) }}
    {{- if ne (toString .Values.config.demoLiveStake) "" }}
    demo_live_stake = {{ include "heimdall.num" .Values.config.demoLiveStake }}
    {{- end }}
    {{- end }}
