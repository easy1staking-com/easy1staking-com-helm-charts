{{- /*
  ⛔ replicas DEFAULTS TO 1 AND SHOULD STAY THERE. There is no HPA and no
  autoscaling stanza anywhere in this chart — nothing that invites a 2.

  This is CORRECTNESS, not preference or cost. The node signs from ONE key with
  no idempotence key: two replicas race the same state and BOTH SIGN before
  either is rejected. Same reason ft-aquarium-node in this repo exposes no
  replicaCount — do not normalise either toward the other charts.
*/ -}}
{{- if not (has .Values.mode (list "run" "register")) -}}
{{- fail (printf "heimdall: mode must be `run` or `register`, got %q. `register` gives you a stable pod to register FROM — the daemon hard-fails startup when unregistered, and a crash-looping pod is never Ready, so a rolling update will not replace it." .Values.mode) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heimdall.fullname" . }}
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
spec:
  {{- /*
    `kindIs "invalid"` and NOT `| default 1`: Helm's `default` treats 0 as empty,
    so `replicas: 0` would silently become 1 — and 0 is the whole point of having
    this value. Same trap as `with` on a numeric zero.
  */}}
  replicas: {{ if kindIs "invalid" .Values.replicas }}1{{ else }}{{ .Values.replicas }}{{ end }}
  {{- /*
    Recreate, not RollingUpdate. RollingUpdate deliberately OVERLAPS the old and
    new pods, which is the precise state the single-signer rule above forbids —
    and the state volume is ReadWriteOnce, so the new pod would not schedule
    anyway.

    ⚠ THE ACCEPTED TRADE, stated because it is real: under Recreate NO DEPLOY
    FAILS SAFELY. The old pod is gone before the new one starts, so a bad image
    tag is downtime rather than a rollout that halts with the old pod serving.
  */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "heimdall.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll the pod when the rendered config changes. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
        {{- /*
          ⛔ THIS ANNOTATION IS LOAD-BEARING — it is not decoration, and removing
          it disables two guards.

          `advertisedUrl` is not emitted into heimdall.toml (registration happens
          off-cluster), so this is the ONLY place the helper is invoked — and a
          Helm helper that nothing calls is dead code. Rendering it here is what
          makes `advertisedUrl` actually REQUIRED, and what actually runs the
          check that a port inside the URL matches listenPort.

          Measured while writing this chart: both guards existed and neither
          fired, because the helper was defined and never included. The render
          was green and the guards were decorative.

          It also earns its place on merit: the running Deployment records what
          was registered on chain, which is otherwise written down nowhere in the
          cluster.
        */}}
        heimdall.easy1staking.com/advertised-url: {{ include "heimdall.advertisedUrl" . | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "heimdall.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- /* 0700 on the state dir, per the upstream package's own posture. */}}
        fsGroup: 1000
      initContainers:
        {{- /*
          ⛔ THIS IS WHERE THE CREDENTIAL ENTERS, AND IT NEVER ENTERS ANYWHERE ELSE.

          heimdall reads blockfrost_project_id from the CONFIG FILE ONLY — the
          shipped example names exactly one environment variable and it is
          $HEIMDALL_MNEMONIC. So a chart that refuses to render a credential into
          its own output (this one) has to complete the file at start.

          Template (ConfigMap, no secret) + Secret -> memory-backed emptyDir.
          The assembled file exists only in the pod's tmpfs: it is never a
          ConfigMap, never a Secret, never in `helm get manifest`, and never on
          disk on the node.

          ⛔ THE PLACEHOLDER MUST NOT SURVIVE. Both failure modes are checked and
          both exit non-zero, because a file still containing the literal
          __BLOCKFROST_PROJECT_ID__ would start the daemon against a nonexistent
          project and fail somewhere far away from the cause.
        */}}
        - name: assemble-config
          image: {{ include "heimdall.initImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              command -v sed >/dev/null 2>&1 || {
                echo "heimdall: no 'sed' in the init image ({{ include "heimdall.initImage" . }})." >&2
                echo "  This step assembles the config with sed; the application image is" >&2
                echo "  Alpine-based and has it. If you have moved to a distroless base, set" >&2
                echo "  initImage to any image providing a POSIX shell and sed." >&2
                exit 1
              }
              if [ -z "${BLOCKFROST_PROJECT_ID:-}" ]; then
                echo "heimdall: the Secret named by blockfrost.secretName gave an EMPTY project id." >&2
                echo "  Secret key: {{ .Values.blockfrost.secretKey }}" >&2
                echo "  Refusing to assemble a config whose credential is blank — the daemon would" >&2
                echo "  start and fail against Blockfrost far away from this cause." >&2
                exit 1
              fi
              sed "s|__BLOCKFROST_PROJECT_ID__|${BLOCKFROST_PROJECT_ID}|" /template/heimdall.toml.template > /assembled/heimdall.toml
              if grep -q '__BLOCKFROST_PROJECT_ID__' /assembled/heimdall.toml; then
                echo "heimdall: substitution did not take — the placeholder is still present." >&2
                exit 1
              fi
              chmod 0400 /assembled/heimdall.toml
          env:
            - name: BLOCKFROST_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "heimdall: blockfrost.secretName is REQUIRED. The Blockfrost project id is a CREDENTIAL: create the Secret out of band and name it here. This chart never carries a credential in values and never renders one into its own output." .Values.blockfrost.secretName }}
                  key: {{ .Values.blockfrost.secretKey | quote }}
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /assembled
      containers:
        - name: heimdall
          image: {{ include "heimdall.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.mode "register" }}
          {{- /*
            ⛔ REGISTER MODE. The daemon is NOT started, and this container serves
            NOTHING on the peer port — nothing binds it, and a placeholder
            /health would advertise a working bridge node that is not one. A
            refused connection is honest.

            `doctor` on a loop rather than a sleep: read-only, spends nothing, and
            turns a blind wait into a live readout of what is still wrong.

            ⛔ THE FLAG IS SPELLED OUT LITERALLY AND MUST STAY THAT WAY. There is NO
            way to invoke a subcommand through this image's entrypoint and receive
            `--config`:
              · zero args        -> entrypoint injects `run-spo --config <path>`
              · args: ["doctor"] -> `command -v doctor` fails, so it is not exec'd
                                    verbatim; it falls through to the config check,
                                    and `$# -eq 1` skips the injection branch. It
                                    execs `heimdall doctor` WITH NO FLAG — blind, by
                                    a different path, and the manifest would read as
                                    though it had been fixed.
            ⇒ Never `args:` alone here, and never rely on the entrypoint for a
            subcommand. Upstream's entrypoint comment says subcommands "all need the
            config too" while the code only checks the file EXISTS and never
            forwards the path.

            ⚠ AND REPLACING THE ENTRYPOINT DROPS TWO OF ITS GUARDS, accepted here
            deliberately: `exit 78` with a legible message when the config file is
            missing (you get a doctor report about an empty world instead), and the
            warning when bind_address is a loopback address. Both are moot in
            register mode — no daemon, no bind address in play. ⇒ BUT IF mode=run's
            argv IS EVER COMPOSED BY HAND it must reproduce `run-spo --config <path>`
            AND both guards. That is the whole reason run mode stays empty.
          */}}
          command:
            - sh
            - -c
            - |
              echo "heimdall: REGISTER MODE — the daemon is NOT running."
              echo "heimdall: this pod exists so there is somewhere stable to"
              echo "heimdall: register FROM. There is no readiness probe in this"
              echo "heimdall: mode and no Service — nothing is served, by design."
              echo "heimdall: THE 11-STEP DOCTOR REPORT IS PRINTED TO THESE LOGS"
              echo "heimdall: EVERY 60s. That is the diagnostic channel here."
              echo "heimdall: Expected while unregistered:"
              echo "heimdall:   [6/11] FAIL  [4/11] WARN  [10/11] FAIL"
              echo "heimdall: ANY OTHER failure is a real problem — fix it before"
              echo "heimdall: spending an on-chain transaction."
              echo "heimdall: step 1 lists ALL local problems at once, not one."
              while true; do
                heimdall doctor --config {{ include "heimdall.configPath" . }} || true
                {{- /*
                  Second, and a DIFFERENT question from doctor's. `bifrost-id`
                  builds no tokio runtime and makes no chain call: it loads the
                  config, loads the identity keypair, prints bifrost_id_pk, exits 1
                  on failure. ⇒ It proves THE CONFIG FILE WAS FOUND AND PARSED and
                  the identity key loads — and nothing else.

                  ⚠ It exits 0 even with state_dir unset and no provider
                  configured. That is what makes it a config-soundness check rather
                  than a readiness gate, and exactly why it must never become one.
                  ⚠ It needs bifrost.skey to exist, so it is meaningless until the
                  key is generated — hence `|| true`, same as doctor.
                */}}
                heimdall bifrost-id --config {{ include "heimdall.configPath" . }} || true
                sleep 60
              done
          {{- else }}
          {{- /*
            ⛔⛔ DAEMON MODE SETS NEITHER `command:` NOR `args:`, AND THAT IS LOAD-
            BEARING. DO NOT "MAKE THE CONFIG PATH EXPLICIT" HERE — DOING SO REMOVES IT.

            The image's entrypoint injects the config path ONLY on the zero-argument
            branch:

              CONFIG="${HEIMDALL_CONFIG:-/etc/heimdall/heimdall.toml}"
              [ "$#" -eq 0 ] && set -- run-spo --config "$CONFIG" ...
              *) command -v "$1" >/dev/null && exec "$@"      # else exec VERBATIM

            ⇒ So the moment this container HAS arguments, the zero-arg branch never
            runs, the injection disappears, and the daemon starts on compiled
            defaults with no state_dir and no provider. THE WORKING INVOCATION WORKS
            BECAUSE THE CHART SAYS NOTHING.

            ⚠ And setting HEIMDALL_CONFIG in the pod env does NOT substitute for a
            flag anywhere else: that variable is read only by the same zero-arg
            branch, which a probe or an exec never reaches.
          */}}
          ports:
            - name: peer
              containerPort: {{ include "heimdall.listenPort" . }}
              protocol: TCP
            {{- if .Values.health.enabled }}
            {{- /*
              ⛔ THE OPERATOR SURFACE — unauthenticated, and NEVER routed by the
              ingress. Reachable in-cluster only, for the kubelet's probes and
              for Prometheus.
            */}}
            - name: health
              containerPort: {{ include "heimdall.num" (.Values.health.port | float64) }}
              protocol: TCP
            {{- end }}
          {{- end }}
          env:
            {{- /*
              ⚠ ENV VAR, NOT A FILE, AND THAT IS A DIVERGENCE FROM THIS REPO'S
              USUAL POSTURE — stated here rather than only in a commit message.
              Elsewhere we mount secrets as files because a file beats an env
              var. The heimdall binary reads ONLY $HEIMDALL_MNEMONIC; there is no
              file mode, and inventing one would configure nothing.

              ⛔ It is read ONLY WHEN `cardano.mnemonic` IS ABSENT from the TOML.
              secret-config.yaml never emits that key, which is what makes this
              work — the absence is the mechanism, not an oversight.
            */}}
            - name: HEIMDALL_MNEMONIC
              valueFrom:
                secretKeyRef:
                  name: {{ required "heimdall: mnemonic.secretName is REQUIRED. Create the Secret out of band and name it here — this chart references Secrets, it never contains them." .Values.mnemonic.secretName }}
                  key: {{ .Values.mnemonic.secretKey | quote }}
          volumeMounts:
            - name: config
              mountPath: {{ include "heimdall.configPath" . }}
              subPath: heimdall.toml
              readOnly: true
            - name: state
              mountPath: {{ .Values.persistence.mountPath }}
          {{- /*
            ⛔ NO readinessProbe, DELIBERATELY. Do not add one.

            /health answers "is this process up", NOT "is this node healthy" — it
            says nothing about roster membership, sync or ceremony state, and no
            endpoint does. A plausible readiness probe would assert something it
            cannot know; a FAILING one would pull this pod out of the Service and
            break the peer reachability every ceremony depends on. Shipping none
            is the honest option, and this comment is here so nobody "completes"
            the chart later.

            Liveness on /health is fine — that is exactly what /health reports.
            The generous budget goes in startupProbe, never in
            livenessProbe.initialDelaySeconds.
          */}}
          {{- if eq .Values.mode "register" }}
          {{- /*
            ⭐ Running but NEVER Ready. `doctor` exits non-zero while its
            registration check fails, so readiness is false until registration
            exists on chain and flips true exactly when the blocking state clears.

            ⇒ That is the whole safety of this mode. An idling pod that reported
            Ready would be indistinguishable from a working one — the inverse of
            the crash-loop problem and the MORE dangerous direction, because
            nothing would ever surface it.

            ⛔ No httpGet here: the daemon is not running and nothing binds the
            port. A probe against it would fail for the wrong reason, and a
            placeholder endpoint to make it pass would be a lie.
          */}}
          {{- /*
            ⛔ NO readinessProbe IN REGISTER MODE, DELIBERATELY. Do not add one back.

            There is no `ports:` block in this mode, so readiness GATES NOTHING —
            there is no traffic for it to withhold. Its only effect was red in
            ArgoCD, permanently, and a signal with no mechanism behind it that is
            guaranteed red teaches an operator to ignore red.

            ⚠ AND THE BANNER ABOVE WAS THE TELL: it printed "Expected until then:
            [6/11] FAIL" while a probe asserted the same command must pass. A check
            whose own documentation says "expected: FAIL" has already been observed
            AGREEING, not working.

            The pod's purpose is legible from that banner and from the doctor
            readout in the logs — in words, rather than in a red dot.
          */}}
          {{- else }}
          {{- /*
            ⛔⛔ `port: peer`, NOT `port: health`. THERE ARE TWO LISTENERS AND ONLY
            THE PEER ONE SERVES /health. Verified in heimdall's source: `/health`
            appears exactly once in the whole tree, at src/http/server.rs:80 on the
            listener bound to http.listen_port. The operator surface (src/health.rs)
            serves only `/` (JSON NodeState) and `/live` — THERE IS NO /health THERE.

            ⇒ Until 0.1.0-alpha.6 these probes hit /health on the health port and
            got a 404 from a listener that was alive and simply had no such route.
            kubelet then restarted a perfectly healthy container.

            ⛔ IT IS NOT A TIMING PROBLEM. Do not retune initialDelaySeconds. The
            peer listener binds BEFORE the operator surface spawns and its routes
            are complete the moment it binds, so an early probe gets a CONNECTION
            REFUSAL, never a 404. A 404 here can only mean the wrong route.

            ⛔ AND DO NOT "FIX" IT BY POINTING AT :18580/live INSTEAD. Upstream binds
            that surface to 127.0.0.1 by default precisely because nothing on it
            authenticates; on a default config the kubelet could not reach it, and
            you would trade a 404 for a connection refusal.

            ⭐ Probing the peer port is also the RIGHT instrument rather than merely
            the working one: it tests exactly what the roster tests. Peers fetch
            /health at the advertised URL, so this probe fails when they would fail.

            ⚠ A 404 body from these axum routers is the literal `404 page not found`
            — byte-identical to what an ingress controller returns when no route
            matches a host. The same four bytes mean "wrong path on the right
            service" and "no such route at the edge". Only a port-by-port curl
            separates them.
          */}}
          startupProbe:
            httpGet:
              path: /health
              port: peer
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: peer
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- /* The template: no secret, so a ConfigMap is correct. */}}
        - name: config-template
          configMap:
            name: {{ include "heimdall.fullname" . }}-config
        {{- /*
          The ASSEMBLED file. medium: Memory — tmpfs, so the completed config
          carrying the credential never reaches the node's disk and dies with the
          pod.
        */}}
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "heimdall.claimName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
