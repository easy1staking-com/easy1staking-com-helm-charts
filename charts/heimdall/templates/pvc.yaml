{{- /*
  ⛔ THE VOLUME THAT LOSES MONEY IF IT IS LOST.

  It holds the epoch's DKG signing share and federation-key.json. A container
  replaced without it comes back UNABLE TO RESUME, and the federation share has
  no second copy: once surviving shares fall below the threshold the recovery
  path is gone for good. It never regenerates.

  `helm.sh/resource-policy: keep` means `helm uninstall` LEAVES THIS BEHIND, and
  Argo CD treats it as `Delete=false`, so an Application with `prune: true` will
  not remove it either.

  ⛔ BUT IT PROTECTS THE OBJECT, NOT THE DATA, and someone will read "keep" as
  "safe". On a StorageClass with `reclaimPolicy: Delete` a manual
  `kubectl delete pvc` still destroys the volume and everything on it —
  including `federation-key.json`, whose loss is permanent.

  ⚠ And `reclaimPolicy` is NOT a field a chart can set: it belongs to the
  StorageClass and the PV, never to the claim. The two levers this chart has are
  `persistence.storageClass` (which is why it is REQUIRED — naming a class is
  what makes its reclaim policy knowable) and `persistence.existingClaim`.

  Skipped entirely when persistence.existingClaim is set — replacing a container
  onto EXISTING state is stage 3 of the pilot, and a chart that provisioned a
  fresh claim there would fail that stage by construction.
*/ -}}
{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "heimdall.fullname" . }}-state
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
