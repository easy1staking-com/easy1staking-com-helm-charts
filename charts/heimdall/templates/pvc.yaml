{{- /*
  THE STATE VOLUME.

  It holds the node identity (`bifrost.skey`), the current cycle's DKG signing
  share, and recomputable trie files. A container replaced without it comes back
  unable to resume and needs a RE-REGISTRATION — an on-chain transaction you can
  simply repeat. That is the real cost: annoying, not catastrophic.

  ⛔ THE FILE WHOSE LOSS WOULD BE PERMANENT IS NOT HERE FOR A JOINING NODE.
  `federation-key.json` comes out of the INITIAL FEDERATION CEREMONY, run by the
  people standing a bridge up; a joining SPO never produces one. If this chart is
  ever used by a bridge FOUNDER, that changes and the volume becomes irreplaceable.
  Stated because the opposite was claimed here until 0.1.0-alpha.3, and an
  overstated warning gets discounted along with the accurate part of it.

  `helm.sh/resource-policy: keep` means `helm uninstall` LEAVES THIS BEHIND, and
  Argo CD treats it as `Delete=false`, so an Application with `prune: true` will
  not remove it either.

  ⚠ BUT IT PROTECTS THE OBJECT, NOT THE DATA, and someone will read "keep" as
  "safe". On a StorageClass with `reclaimPolicy: Delete` a manual
  `kubectl delete pvc` still destroys the volume and everything on it.

  ⚠ `reclaimPolicy` is NOT a field a chart can set — it belongs to the
  StorageClass and the PV, never to the claim. So the declarative way to get
  `Retain` is a StorageClass manifest in git, named via
  `persistence.storageClass`; see values.yaml for that and for the repair path
  for a volume that already exists on the wrong class.

  Skipped entirely when persistence.existingClaim is set — replacing a container
  onto EXISTING state is stage 3 of the pilot, and a chart that provisioned a
  fresh claim there would fail that stage by construction.
*/ -}}
{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "heimdall.fullname" . }}-state
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
