apiVersion: v2
name: heimdall
description: Easy1Staking's node in the Bifrost BTC<->Cardano bridge (preprod pilot)

type: application

# Chart version — this chart's own semver. Bump on every chart change.
# NOTE: bumping this in a commit to `main` publishes the chart immediately via
# chart-releaser. That bump is the release gate and belongs to Giovanni.
version: 0.1.0

# ⛔ THERE IS DELIBERATELY NO `appVersion`, and that is a divergence from every
# other chart in this repository. Do not "fix" it by adding one.
#
# `appVersion` is metadata, but it is READ AS "the build we run" — and for this
# workload that sentence has an operational meaning it does not have elsewhere.
# Before every ceremony each node compares peers' /health: `version` AND
# `blueprint_digest` must MATCH ACROSS THE ROSTER, and a mismatched peer is named
# by pool id and left out of that ceremony. So the build to run is the one THE
# ROSTER runs, never the newest — and a number written here would become an
# answer to "which version?" without anyone having asked the roster.
#
# The image tag is therefore a REQUIRED VALUE with no default (see values.yaml),
# and `app.kubernetes.io/version` is labelled from that tag rather than from
# here, so the label states what is actually running.
