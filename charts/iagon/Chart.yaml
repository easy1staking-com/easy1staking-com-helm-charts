apiVersion: v2
name: iagon
description: A Helm chart for the Iagon Storage Node

type: application

# Chart version — this chart's own semver. Bump on every chart change.
# NOTE: bumping this in a commit to `main` publishes the chart immediately via
# chart-releaser. That bump is the release gate and belongs to Giovanni.
version: 0.1.0

# Upstream application version. This is the `iagon-node` release baked into
# easy1staking/iagon by docker/iagon/Dockerfile, pinned there by sha256.
# v2 replaced the retired v1 `iag-cli-linux` — see the chart README.
appVersion: "2.0.13"
