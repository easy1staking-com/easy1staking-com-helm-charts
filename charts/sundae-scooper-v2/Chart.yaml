apiVersion: v2
name: sundae-scooper-v2
description: SundaeSwap scooper v2 — produces the scoops that execute v4 DEX swaps

type: application

# Chart version — this chart's own semver. Bump on every chart change.
# NOTE: bumping this in a commit to `main` publishes the chart immediately via
# chart-releaser. That bump is the release gate and belongs to Giovanni.
#
# ⚠ ALPHA — NOT YET RUN AGAINST A LIVE SCOOPER. The SemVer pre-release suffix is
# load-bearing: `helm search` and `helm install` will not select this without
# `--devel` or an explicit version. It comes off when a scooper has actually run
# from it. Same convention as the `heimdall` chart in this repo.
version: 0.1.0-alpha.1

# Upstream image tag. Published by SundaeSwap, not by us.
# ⛔ NOT a default — see values.yaml `image.tag`. This records the newest tag
# seen when the chart was written (2026-09-15) and is NOT an instruction to run
# it; a scooper roster generally wants the build the rest of the roster runs.
appVersion: "v0.6.0"
