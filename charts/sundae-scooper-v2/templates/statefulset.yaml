{{- if and .Values.mempool.enabled (eq (toString .Values.mempool.networkMagic) "") -}}
{{- fail "sundae-scooper-v2: mempool.enabled is true so mempool.networkMagic is REQUIRED. The binary needs exactly two mempool fields — socket-path and network-magic — and omitting this one leaves upstream's file to supply it. preview 2 · preprod 1 · mainnet 764824073." -}}
{{- end -}}
{{- if .Values.mempool.enabled -}}
{{- if not (has .Values.mempool.source (list "socat" "hostPath" "existingClaim" "external")) -}}
{{- fail (printf "sundae-scooper-v2: mempool.enabled is true so mempool.source is REQUIRED — got %q. v4 execution needs a cardano-node IPC socket and this chart does not provision a node. Choose: `socat` (a sidecar in this pod bridges TCP back to a unix socket — the route that works when the node keeps its socket inside its own PVC, and what the v1 chart did), `hostPath` (same-machine socket; set nodeSelector or it schedules away and the socket is SILENTLY absent), `existingClaim` (a claim already carrying the socket — never the node's own live database claim), or `external` (you wire it via extraContainers/extraVolumes and this guard steps aside)." .Values.mempool.source) -}}
{{- end -}}
{{- end -}}
{{- if .Values.v4.enabled -}}
{{- if not .Values.submitUrl -}}
{{- fail "sundae-scooper-v2: v4.enabled is true, so submitUrl is REQUIRED. Upstream's *-v4.json already carries a submit-url and it is a Blockfrost URL with UPSTREAM'S project id in the query string; config files are applied in order, so this value is what displaces theirs. Leaving it empty would submit through SundaeSwap's Blockfrost account — which would probably work, which is exactly the problem. For an in-cluster Ogmios: http://<service>.<ns>.svc.cluster.local:1337 (http, not ws; no path)." -}}
{{- end -}}
{{- if contains "blockfrost.io" .Values.submitUrl -}}
{{- fail "sundae-scooper-v2: submitUrl points at blockfrost.io. A Blockfrost submit URL carries its project id IN THE QUERY STRING, so this would put a credential in a values file — and this chart repository is public. Use an in-cluster Ogmios or cardano-submit-api instead, or set SCOOPER_V2_PROTOCOL__V4__EXECUTION__SUBMIT_URL at runtime from a Secret and leave submitUrl empty." -}}
{{- end -}}
{{- if hasPrefix "ws://" .Values.submitUrl -}}
{{- fail "sundae-scooper-v2: submitUrl uses ws://. The Ogmios branch does an HTTP POST with a JSON-RPC body, not a websocket upgrade — use http:// with no path. And note Ogmios is the FALLBACK branch, so a wrong shape is not rejected, it is POSTed to as if it were Ogmios." -}}
{{- end -}}
{{- end -}}
{{- if and .Values.v4.enabled (not .Values.secret.name) -}}
{{- fail "sundae-scooper-v2: v4.enabled is true, so secret.name is REQUIRED — v4 execution is the only path that signs, and it reads the key from a file. With v4 off the key is unused and this may be empty (v3 has no execution block, so a v3-only scooper indexes and does not scoop)." -}}
{{- end -}}
{{- if not .Values.config.existingConfigMap -}}
{{- fail "sundae-scooper-v2: config.existingConfigMap is REQUIRED. No network config ships in the upstream image — its own Dockerfile says so — so there is nothing to inherit. Create a ConfigMap holding upstream's config JSON verbatim (copy config/<network>.json, plus <network>-v4.json for v4, from the scooper-v2 repo) and name it here." -}}
{{- end -}}
{{- if not .Values.config.files -}}
{{- fail "sundae-scooper-v2: config.files is REQUIRED and must list, IN ORDER, which keys of config.existingConfigMap to pass as --config. Order decides precedence: later files override earlier ones. e.g. [preview.json] for v3 only, or [preview.json, preview-v4.json] for v4 execution." -}}
{{- end -}}
{{- /*
  ⛔ replicas: 1, HARDCODED, with no replicaCount value.

  A scooper SIGNS from one key. Two replicas would race the same SQLite index
  and build competing scoops from the same pool state — and a scoop that loses
  the race is a wasted transaction fee, not a no-op. Same reasoning as
  ft-aquarium-node and heimdall in this repo; do not normalise it toward the
  others.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sundae-scooper-v2.fullname" . }}
  labels:
    {{- include "sundae-scooper-v2.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "sundae-scooper-v2.fullname" . }}-headless
  {{- /*
    OrderedReady + one replica means an upgrade terminates the old pod before
    the new one starts. That is deliberate: the SQLite index is RWO and two
    scoopers must not overlap. ⚠ The trade is that no upgrade fails safely —
    there is no old pod to fall back to if the new image is wrong.
  */}}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "sundae-scooper-v2.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/overlay: {{ include (print $.Template.BasePath "/configmap-overlay.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sundae-scooper-v2.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- /* Upstream's image creates and runs as uid/gid 10001. */}}
        fsGroup: 10001
      containers:
        - name: scooper
          image: {{ include "sundae-scooper-v2.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /*
            `--config` is repeatable and applied IN ORDER. Upstream's files
            first, the chart's overlay LAST so it wins. The image's own CMD
            passes a single /app/config.json, which we replace entirely.
          */}}
          args:
            {{- range .Values.config.files }}
            - --config
            - /app/config/{{ . }}
            {{- end }}
            - --config
            - /app/config-overlay/zz-chart-overlay.json
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: private
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.config.overlay.publicAddress }}
            - name: public
              containerPort: {{ .Values.service.publicPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- with .Values.bootstrap.projectId.secretName }}
            {{- /*
              The Blockfrost project id, by reference. Upstream's env override
              form is SCOOPER_V2_<PATH> with `__` for nesting.
            */}}
            - name: SCOOPER_V2_PROTOCOL__BOOTSTRAP__PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.bootstrap.projectId.secretKey | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: config-overlay
              mountPath: /app/config-overlay
              readOnly: true
            {{- if .Values.secret.name }}
            - name: secret
              mountPath: /app/secret
              readOnly: true
            {{- end }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- /*
              ⛔ GATED IDENTICALLY TO THE VOLUME BELOW, and it must stay that
              way. With source: external the chart renders NO node-ipc volume —
              the operator supplies it — so mounting one here would reference a
              volume that does not exist and the pod would fail to schedule with
              a message about a missing volume rather than about the mempool.
              Measured while adding `external`: the two were gated differently
              and that is exactly how it broke.
            */}}
            {{- if and .Values.mempool.enabled (ne .Values.mempool.source "external") }}
            - name: node-ipc
              mountPath: {{ dir .Values.mempool.socketPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            ⚠ /health reports that the PROCESS is up. It does not report that the
            scooper is synced, in the roster, or scooping — treat a 200 as
            liveness only. The generous budget goes in startupProbe, never in
            livenessProbe.initialDelaySeconds: a cold index rebuilds from chain.
          */}}
          startupProbe:
            httpGet:
              path: /health
              port: private
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: private
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if and .Values.mempool.enabled (eq .Values.mempool.source "socat") }}
        {{- /*
          The inverse of the socat the node already runs. The node side is
          `socat TCP-LISTEN:<port>,fork UNIX-CONNECT:/data/db/node.socket`; this
          presents a unix socket in the shared emptyDir and forwards to it, so
          the scooper never touches the node's volume.
        */}}
        - name: socat-node-ipc
          image: "{{ .Values.mempool.socat.image.repository }}:{{ required "sundae-scooper-v2: mempool.source is socat, so mempool.socat.image.tag is REQUIRED. A sidecar that changes under you is a debugging session nobody scheduled." .Values.mempool.socat.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - UNIX-LISTEN:{{ .Values.mempool.socketPath }},fork,unlink-early,mode=660
            - TCP:{{ required "sundae-scooper-v2: mempool.source is socat, so mempool.socat.host is REQUIRED — the Service of the node-side socat." .Values.mempool.socat.host }}:{{ include "sundae-scooper-v2.num" .Values.mempool.socat.port }}
          volumeMounts:
            - name: node-ipc
              mountPath: {{ dir .Values.mempool.socketPath }}
          resources:
            {{- toYaml .Values.mempool.socat.resources | nindent 12 }}
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap }}
        - name: config-overlay
          configMap:
            name: {{ include "sundae-scooper-v2.fullname" . }}-overlay
        {{- if .Values.secret.name }}
        - name: secret
          secret:
            secretName: {{ .Values.secret.name }}
            defaultMode: 0400
        {{- end }}
        {{- if and .Values.mempool.enabled (ne .Values.mempool.source "external") }}
        - name: node-ipc
          {{- if eq .Values.mempool.source "socat" }}
          {{- /*
            An emptyDir shared by the socat sidecar and the scooper. The socket
            is created HERE, so nothing touches the node's own volume and the
            scooper gets no access to the node's database directory.
          */}}
          emptyDir: {}
          {{- else if eq .Values.mempool.source "hostPath" }}
          {{- /*
            ⚠ A hostPath TIES THIS POD TO ONE NODE. Set nodeSelector to match, or
            the pod schedules elsewhere and the socket is silently absent — the
            scooper then indexes fine and never reads a mempool.
          */}}
          hostPath:
            path: {{ required "sundae-scooper-v2: mempool.source is hostPath but mempool.hostPath is empty." .Values.mempool.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ required "sundae-scooper-v2: mempool.source is existingClaim but mempool.existingClaim is empty." .Values.mempool.existingClaim }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
